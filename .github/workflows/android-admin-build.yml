name: Android Admin Build

on:
  push:
    branches: [main]
    paths:
      - android-admin/**
      - .github/workflows/android-admin-build.yml
  pull_request:
    branches: [main]
    paths:
      - android-admin/**
      - .github/workflows/android-admin-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK and run unit tests
        working-directory: android-admin
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HDCareersAdmin-Android-Debug
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
