name: Android Admin Build

on:
  push:
    branches: [main]
    paths:
      - android-admin/**
      - .github/workflows/android-admin-build.yml
  pull_request:
    branches: [main]
    paths:
      - android-admin/**
      - .github/workflows/android-admin-build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK using preinstalled Android tooling
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK and run unit tests
        working-directory: android-admin
        run: gradle --no-daemon :app:assembleDebug :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: HDCareersAdmin-Android-Debug
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
