name: Generate missing job pages

on:
  push:
    branches: [main]
    paths:
      - 'data/jobs.json'
      - '.github/workflows/generate-job-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-job-pages-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Generate website
        run: |
          python3 generate.py --dry-run
          python3 generate.py
      - name: Commit generated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Generate job pages and sitemap from jobs data"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
