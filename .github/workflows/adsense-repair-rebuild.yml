name: Rebuild AdSense Repair Branch (temporary)
on:
  push:
    branches:
      - fix/adsense-content-recovery-20261104

permissions:
  contents: write

concurrency:
  group: adsense-repair-branch
  cancel-in-progress: false

jobs:
  rebuild:
    if: github.event.head_commit.message != 'Refresh AdSense repair preview output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/adsense-content-recovery-20261104
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source-derived content and job classification
        run: |
          python3 -m unittest discover -s tests -p test_adsense_content.py -v
          python3 -m unittest discover -s tests -p test_job_hero.py -v
      - name: Regenerate website without deploying or Telegram sends
        run: |
          python3 generate.py
          git diff --check
      - name: Save generated static content to repair branch
        run: |
          set -euo pipefail
          git config user.name "HD Careers Automation"
          git config user.email "actions@users.noreply.github.com"
          git add index.html jobs/ insights.html insights/ sitemap.xml robots.txt data/insights-summary.json
          if git diff --cached --quiet; then
            echo "Generated content is already current."
            exit 0
          fi
          git commit -m "Refresh AdSense repair preview output"
          git push origin HEAD:fix/adsense-content-recovery-20261104
