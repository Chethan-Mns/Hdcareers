name: Ten employer links shadow-only benchmark

on:
  push:
    branches:
      - feature/strict-live-publish-closed-only-test-20261013
    paths:
      - scripts/test_owner_verification_shadow.py
      - tests/fixtures/owner_manual_verification_20261013.json
      - .github/workflows/owner-10-job-shadow-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-live-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm no mutation or publication credentials are available
        run: |
          test -z "${TELEGRAM_BOT_TOKEN:-}"
          test -z "${GITHUB_PUBLISH_TOKEN:-}"
          test -z "${VERCEL_TOKEN:-}"
      - name: Read-only comparison with ten owner-verified roles
        run: python3 scripts/test_owner_verification_shadow.py
      - name: Save independent benchmark and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owner-ten-live-source-benchmark
          path: owner-10-job-shadow-report.json
          if-no-files-found: warn
          retention-days: 30
