name: Temporary Final Replica Preview Generation
on:
  push:
    branches:
      - preview/final-replica-20261021
    paths:
      - .github/workflows/final-replica-generator.yml
permissions:
  contents: write
jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate production-shaped preview files
        run: |
          python3 -m py_compile generate.py
          python3 generate.py
          git diff --check
          python3 generate.py --dry-run
      - name: Publish generated preview files only to review branch
        run: |
          git config user.name "HD Careers Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html insights.html insights/weekly-hiring-insights.html data/insights-summary.json jobs/ sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate final review preview with current job data"
            git push origin HEAD:preview/final-replica-20261021
          fi
