name: Temporary Final Replica Preview Generation
on:
  push:
    branches:
      - preview/final-replica-20261021
    paths:
      - .github/workflows/final-replica-generator.yml
permissions:
  contents: write
jobs:
  render-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild branch pages and check generator
        run: |
          python3 -m py_compile generate.py
          python3 generate.py
          echo 'Rebuilt map and location counters using current jobs'
          git diff --check
          python3 generate.py --dry-run
      - name: Commit only generated files to preview branch
        run: |
          git config user.name "HD Careers Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html insights.html insights/weekly-hiring-insights.html data/insights-summary.json jobs/ robots.txt sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild dark-navy approved-candidate preview from job data"
            git push origin HEAD:preview/final-replica-20261021
          fi
