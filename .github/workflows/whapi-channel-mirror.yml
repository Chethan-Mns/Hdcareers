name: HD Careers WhatsApp Channel Mirror (Whapi.Cloud)

on:
  schedule:
    # Mirror Telegram-confirmed deliveries. GitHub cron may be delayed.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      verify_only:
        description: "Check Whapi connection and Channel ADMIN/OWNER role without posting"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  mirror:
    # Posting is gated by the owner configuration below.
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
      WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
      WAHA_CHANNEL_ENABLED: ${{ vars.WAHA_CHANNEL_ENABLED }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh newest published Telegram/job ledger
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Check owner opt-in, approved Channel and provider credentials
        id: configured
        env:
          VERIFY_ONLY: ${{ inputs.verify_only }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          cfg=json.loads(Path("data/whapi-channel-config.json").read_text())
          assert cfg.get("version")==1
          assert cfg.get("channelName")=="HD Career Updates"
          assert cfg.get("channelId")=="120363419928883930@newsletter"
          assert cfg.get("maxPostsPerDay")==10
          verify=os.getenv("VERIFY_ONLY","").lower()=="true"
          if verify:
              print("Read-only verification; posting disabled for this run")
          elif cfg.get("enabled") is not True:
              print("Whapi daily relay paused in owner configuration; no messages sent")
          else:
              if os.getenv("WAHA_CHANNEL_ENABLED","").lower()=="true":
                  raise SystemExit("Cannot run Whapi while old WAHA relay is enabled")
              if os.getenv("WHAPI_CHANNEL_ID")!=cfg["channelId"]:
                  raise SystemExit("Destination does not match HD Career Updates")
              if len(os.getenv("WHAPI_TOKEN",""))<16:
                  raise SystemExit("Whapi secret missing")
              with open(os.environ["GITHUB_OUTPUT"],"a") as o:
                  o.write("enabled=true\n")
              print("Verified owner opt-in and exact target Channel")
          PY
      - name: Validate safety and Whapi API contract
        if: inputs.verify_only == true || steps.configured.outputs.enabled == 'true'
        run: |
          python3 -m py_compile scripts/whapi_channel_relay.py scripts/whatsapp_channel_relay.py
          python3 -m unittest discover -s tests -p test_whapi_channel_relay.py -v
          python3 -m unittest discover -s tests -p test_whatsapp_channel_relay.py -v
          python3 -m unittest discover -s tests -p test_whapi_daily_pipeline.py -v
      - name: Verify Channel admin permission without posting
        if: github.event_name == 'workflow_dispatch' && inputs.verify_only == true
        run: python3 scripts/whapi_channel_relay.py verify
      - name: Precommit exactly one Telegram-confirmed WhatsApp claim
        if: steps.configured.outputs.enabled == 'true'
        id: claim
        env:
          WHAPI_CHANNEL_ENABLED: "true"
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/whapi_channel_relay.py claim
          git config user.name "HD Careers Whapi Mirror"
          git config user.email "actions@users.noreply.github.com"
          git add data/whatsapp-channel-deliveries.json
          if ! git diff --cached --quiet; then
            git commit -m "Persist Whapi pre-send Channel claim"
            git push origin HEAD:main
          fi
      - name: Recheck official source, live job page and Channel admin; send
        if: steps.claim.outputs.claimed == 'true'
        env:
          WHAPI_CHANNEL_ENABLED: "true"
        run: python3 scripts/whapi_channel_relay.py send
      - name: Persist accepted, skipped or uncertain outcome
        if: always() && steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git add data/whatsapp-channel-deliveries.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Whapi Channel posting outcome"
            git push origin HEAD:main
          fi
      - name: Preserve evidence for manual reconciliation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd-whapi-channel-outcome
          path: data/whatsapp-channel-deliveries.json
          retention-days: 30
