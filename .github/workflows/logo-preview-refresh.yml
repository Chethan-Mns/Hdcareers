name: Company Logo Preview Refresh

on:
  push:
    branches:
      - preview/official-company-favicons
    paths:
      - scripts/resolve_company_logos.py
      - data/company-logo-domains.json
      - data/company-logo-direct.json
      - data/company-logo-quality-fallbacks.json
      - .github/workflows/logo-preview-refresh.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/official-company-favicons
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install logo quality dependency
        run: python3 -m pip install --disable-pip-version-check "Pillow>=11,<13"

      - name: Resolve and cache official company favicons
        run: python3 scripts/resolve_company_logos.py --refresh

      - name: Regenerate preview website
        run: |
          python3 generate.py
          git diff --check

      - name: Save preview assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HD Careers Logo Preview"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json data/company-logos.json assets/company-icons index.html jobs/ logo-preview.html robots.txt sitemap.xml
          if git diff --cached --quiet; then
            echo "No logo preview changes."
            exit 0
          fi
          git commit -m "Refresh official company favicon preview"
          git push origin HEAD:preview/official-company-favicons
