name: Approved nine-job publishing safety

on:
  push:
    branches:
      - feature/publish-approved-nine-20261011
    paths:
      - scripts/prepare_review_publication.py
      - tests/test_approved_nine_publication.py
      - .github/workflows/approved-nine-publish-ci.yml
      - .github/workflows/admin-job-generator.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-guarded-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate approved selection script and existing workflow wiring
        run: |
          python3 -m py_compile scripts/prepare_review_publication.py
          python3 -m unittest discover -s tests -p test_approved_nine_publication.py -v
          python3 - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/admin-job-generator.yml').read_text()
          assert 'data/approved-review-publication.json' in w
          assert 'scripts/prepare_review_publication.py' in w
          assert 'scripts/admin_publish.py "$approved_event"' in w
          assert 'scripts/publish_approved_telegram.py' in w
          print('Existing website + Telegram workflow is wired to guarded nine-job request')
          PY
      - name: Verify Telegram receipts can persist without duplicates
        run: |
          python3 -m py_compile scripts/merge_telegram_delivery_receipts.py
          python3 -m unittest discover -s tests -p test_telegram_receipt_safe_sync.py -v
      - name: Validate Owner nine-job selection or verify it has already published safely
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          from admin_publish import validate
          request=json.loads(Path('data/approved-review-publication.json').read_text())
          batch=json.loads(Path('data/daily-review-batch.json').read_text())
          published=json.loads(Path('data/jobs.json').read_text())
          ledger=json.loads(Path('data/telegram-deliveries.json').read_text())
          ids=request['candidateIds']
          assert len(ids)==9 and len(set(ids))==9 and 'unisys-REQ568332' not in ids
          staged={str(x['id']):x for x in batch['priority']}
          assert all(staged[x]['reviewedStatus']=='live' for x in ids)
          expected={staged[x]['job']['apply'] for x in ids}
          actual={j['apply']:j for j in published if j.get('apply') in expected}
          if len(actual)==9:
              assert len({j['company'].casefold() for j in actual.values()})==9
              for job in actual.values():
                  validate(job,0)
                  assert any(v.get('page')==job['page'] and v.get('status')=='delivered'
                             and isinstance(v.get('messageId'),int) for v in ledger.values())
              print('Nine jobs already published, site data persisted and nine Telegram receipts confirmed. NO DUPLICATE PUBLISH.')
          else:
              assert not actual,'Only part of the approved batch is published; manual reconciliation required.'
              subprocess.run(['python3','scripts/prepare_review_publication.py',
                              'data/approved-review-publication.json','/tmp/hd-nine-preflight.json'],check=True)
              payload=json.loads(Path('/tmp/hd-nine-preflight.json').read_text())
              selected=payload['client_payload']['jobs']
              assert len(selected)==9
              for index,job in enumerate(selected):
                  validate(job,index)
                  assert job['status']=='active' and job['manualLiveVerifiedUrl']==job['apply']
              print('Validated nine real jobs against existing publisher schema; NO LIVE WRITES.')
          PY
