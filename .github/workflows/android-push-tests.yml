name: Android Push Backend Tests

on:
  pull_request:
    branches: [main]
    paths:
      - lib/android-notify.js
      - api/admin/android-*.js
      - api/notifications/android-dispatch.js
      - tests/android-notify.test.mjs
      - .github/workflows/android-push-tests.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate API syntax
        run: |
          node --check lib/android-notify.js
          node --check api/admin/android-devices.js
          node --check api/notifications/android-dispatch.js
      - name: Test auth, private storage, Firebase OAuth and push delivery request
        run: node --experimental-default-type=module --test tests/android-notify.test.mjs
