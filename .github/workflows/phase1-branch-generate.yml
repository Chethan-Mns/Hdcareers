name: Phase 1 branch-only generated output sync
on:
  push:
    branches:
      - fix/phase1-verification-publish-safety-20261013
    paths:
      - generate.py
      - index.html
      - data/availability-status.json
      - data/jobs.json
      - .github/workflows/phase1-branch-generate.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phase1-branch-generator
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/phase1-verification-publish-safety-20261013
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate isolated preview branch pages
        run: |
          python3 generate.py
          git diff --check
      - name: Commit only generated website output to feature branch
        run: |
          set -euo pipefail
          git config user.name 'HD Careers Phase 1 CI'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html jobs/ insights.html insights/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo 'Generated website is current.'
            exit 0
          fi
          git commit -m 'Phase 1: regenerate verified preview job pages'
          git push origin HEAD:fix/phase1-verification-publish-safety-20261013
