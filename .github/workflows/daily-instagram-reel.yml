name: HD Careers Daily Reel Factory

on:
  schedule:
    - cron: "30 13 * * *"  # 7:00 PM Asia/Kolkata, GitHub scheduling may be delayed
  workflow_dispatch:
    inputs:
      job_id:
        description: "Optional verified job ID"
        required: false
        type: string
      publish:
        description: "Explicitly publish after rendering and verification"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: hd-daily-reel-factory
  cancel-in-progress: false

jobs:
  prepare-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HD_REEL_VOICE_ENGINE: elevenlabs-sarah
      HD_REEL_FREE_VOICE_FALLBACK: "false"
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      HD_REEL_AUDIO_COMMERCIAL_LICENSE_CONFIRMED: ${{ vars.HD_REEL_AUDIO_COMMERCIAL_LICENSE_CONFIRMED }}
      HD_REEL_VOICE_RATE: "-3%"
      SUPERPROFILE_MCP_ACCESS_TOKEN: ${{ secrets.SUPERPROFILE_MCP_ACCESS_TOKEN }}
      SHOULD_PUBLISH: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish == true) || (github.event_name == 'schedule' && vars.HD_REELS_AUTOPUBLISH == 'true') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free voice engines, FFmpeg and image rendering
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --disable-pip-version-check "Pillow>=11,<13" "edge-tts>=7.3.1,<8" "gTTS>=2.5,<3"
      - name: Run safety tests and compile scripts
        run: |
          python3 -m py_compile scripts/reel_voice.py scripts/reel_voice_elevenlabs.py scripts/reel_video.py scripts/reel_factory.py scripts/reel_preflight.py scripts/superprofile_reel_bridge.py scripts/reel_superprofile_handoff.py
          node --check scripts/reel_upload.mjs
          python3 -m unittest discover -s tests -p test_reel_factory.py -v
          python3 -m unittest discover -s tests -p test_reel_voice.py -v
          python3 -m unittest discover -s tests -p test_reel_video_timing.py -v
          python3 -m unittest discover -s tests -p test_reel_pipeline.py -v
          python3 -m unittest discover -s tests -p test_reel_superprofile_handoff.py -v
      - name: Prepare script, caption, employer card and Reel where configured
        env:
          PICK_ID: ${{ inputs.job_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$PICK_ID" ]; then
            if ! [[ "$PICK_ID" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid job ID"; exit 1
            fi
            python3 scripts/reel_factory.py --job-id "$PICK_ID" --render
          else
            python3 scripts/reel_factory.py --render
          fi
          if [ -f artifacts/reel/status.json ]; then cat artifacts/reel/status.json; fi
      - name: Prepare per-Reel any-comment SuperProfile Auto-DM specification (NO MESSAGES)
        shell: bash
        run: |
          if [ -s artifacts/reel/manifest.json ]; then
            python3 scripts/reel_superprofile_handoff.py
          else
            echo "No verified Reel selected; no SuperProfile draft created."
          fi
      - name: Preserve preview assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd-reel-${{ github.run_id }}
          path: artifacts/reel/
          if-no-files-found: ignore
          retention-days: 14
      - name: Schedule only when licensed, complete and connected to SuperProfile
        id: superprofile
        shell: bash
        run: |
          set -euo pipefail
          if [ "$SHOULD_PUBLISH" != "true" ]; then
            echo "Preview only: Instagram Reel and DM are NOT live."
            exit 0
          fi
          if [ -z "$SUPERPROFILE_MCP_ACCESS_TOKEN" ]; then
            echo "::error::SuperProfile GitHub worker OAuth is missing. ChatGPT's connection cannot be silently reused."
            exit 1
          fi
          if [ ! -s artifacts/reel/reel.mp4 ]; then
            echo "::warning::Missing approved footage or aligned narration. No Reel scheduled."
            exit 0
          fi
          python3 scripts/reel_preflight.py \
            --manifest artifacts/reel/manifest.json \
            --status artifacts/reel/status.json \
            --video artifacts/reel/reel.mp4 \
            --require-commercial-license
          python3 scripts/superprofile_reel_bridge.py \
            --manifest artifacts/reel/manifest.json \
            --status artifacts/reel/status.json \
            --video artifacts/reel/reel.mp4
          echo "scheduled=true" >> "$GITHUB_OUTPUT"
      - name: Record the confirmed SuperProfile schedule to prevent duplicate Reels
        if: steps.superprofile.outputs.scheduled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path("data/reel-posts.json")
          known=json.loads(path.read_text(encoding="utf8"))
          r=json.loads(Path("artifacts/reel/superprofile-post-receipt.json").read_text(encoding="utf8"))
          if r.get("state")!="scheduled" or not r.get("postId") or not r.get("autoDm",{}).get("autoDmId"):
              raise SystemExit("Schedule was not confirmed with an attached job Auto-DM")
          if any(str(p.get("jobId"))==str(r["jobId"]) for p in known):
              raise SystemExit("Duplicate Reel ledger entry; check provider before further publishing")
          known.append({"jobId":r["jobId"],"status":"scheduled","provider":"superprofile",
                        "superprofilePostId":r["postId"],"superprofileAutoDmId":r["autoDm"]["autoDmId"],
                        "scheduledAt":r["scheduledAt"],"jobUrl":r["jobUrl"]})
          path.write_text(json.dumps(known,ensure_ascii=False,indent=2)+"\n",encoding="utf8")
          PY
          git config user.name "HD Careers Reel Factory"
          git config user.email "actions@users.noreply.github.com"
          git add data/reel-posts.json
          git diff --cached --quiet && exit 0
          git commit -m "Track SuperProfile scheduled Reel and job-specific Auto-DM"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Preserve SuperProfile publication handoff receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hd-reel-delivery-${{ github.run_id }}
          path: artifacts/reel/superprofile-post-receipt.json
          if-no-files-found: ignore
          retention-days: 30
