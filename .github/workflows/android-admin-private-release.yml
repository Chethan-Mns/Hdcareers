name: HD Careers Admin Private Signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - android-admin/**
      - .github/workflows/android-admin-private-release.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK using preinstalled Android tooling
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore private signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.HD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing credentials missing; refusing to produce unsigned release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hdcareers-release.jks"
          chmod 600 "$RUNNER_TEMP/hdcareers-release.jks"
      - name: Build privately signed release APK
        working-directory: android-admin
        env:
          HD_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hdcareers-release.jks
          HD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HD_ANDROID_KEYSTORE_PASSWORD }}
          HD_ANDROID_KEY_ALIAS: ${{ secrets.HD_ANDROID_KEY_ALIAS }}
          HD_ANDROID_KEY_PASSWORD: ${{ secrets.HD_ANDROID_KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ vars.HD_FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.HD_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.HD_FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.HD_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          for name in FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID; do
            test -n "${!name}" || { echo "::error::Missing $name GitHub Actions variable"; exit 1; }
          done
          gradle --no-daemon :app:assembleRelease :app:testReleaseUnitTest
      - name: Verify signing certificate
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android-admin/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HDCareersAdmin-Android-Private-Signed
          path: android-admin/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload signed APK to private R2 and publish update manifest
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HD_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HD_R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.HD_R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.HD_R2_BUCKET }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY R2_ACCOUNT_ID R2_BUCKET; do
            test -n "${!name}" || { echo "::error::Private R2 setting missing: $name"; exit 1; }
          done
          export AWS_DEFAULT_REGION=auto
          KEY="hdcareers/android/${GITHUB_SHA}/app-release.apk"
          APK="android-admin/app/build/outputs/apk/release/app-release.apk"
          aws s3 cp "$APK" "s3://$R2_BUCKET/$KEY" --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" --no-progress
          HASH=$(sha256sum "$APK" | cut -d' ' -f1)
          CODE=$(sed -nE 's/.*versionCode = ([0-9]+).*/\1/p' android-admin/app/build.gradle.kts | head -1)
          NAME=$(sed -nE 's/.*versionName = "([^"]+)".*/\1/p' android-admin/app/build.gradle.kts | head -1)
          test -n "$CODE" && test -n "$NAME" && test -n "$HASH"
          mkdir -p data
          python3 - "$CODE" "$NAME" "$HASH" "$KEY" <<'PY'
          import json,sys
          from pathlib import Path
          code,name,sha,key=sys.argv[1:]
          Path("data/android-release.json").write_text(json.dumps({"versionCode":int(code),"versionName":name,"sha256":sha,"objectKey":key,"notes":"HD Careers app improvements"},indent=2)+"\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/android-release.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish private Android update manifest [skip ci]"
            git push origin HEAD:main
          fi
