name: HD Careers Existing Admin Signed ATS Pilot

on:
  workflow_dispatch:
  push:
    branches: [dev/verification-precision-expiry-branding-20261018]
    paths:
      - android-admin/**
      - .github/workflows/android-admin-dev-ats-pilot.yml

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK using preinstalled Android tooling
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Restore private signing credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.HD_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "Signing credentials missing; refusing to produce unsigned release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/hdcareers-release.jks"
          chmod 600 "$RUNNER_TEMP/hdcareers-release.jks"
      - name: Build privately signed release APK
        working-directory: android-admin
        env:
          HD_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/hdcareers-release.jks
          HD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.HD_ANDROID_KEYSTORE_PASSWORD }}
          HD_ANDROID_KEY_ALIAS: ${{ secrets.HD_ANDROID_KEY_ALIAS }}
          HD_ANDROID_KEY_PASSWORD: ${{ secrets.HD_ANDROID_KEY_PASSWORD }}
          FIREBASE_APP_ID: ${{ vars.HD_FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ vars.HD_FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ vars.HD_FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ vars.HD_FIREBASE_SENDER_ID }}
        run: |
          set -euo pipefail
          for name in FIREBASE_APP_ID FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_SENDER_ID; do
            test -n "${!name}" || { echo "::error::Missing $name GitHub Actions variable"; exit 1; }
          done
          gradle --no-daemon :app:assembleRelease :app:testReleaseUnitTest
      - name: Verify signing certificate
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs android-admin/app/build/outputs/apk/release/app-release.apk
      - name: Verify this updates the original Android app, not a separate QA app
        run: |
          APK="android-admin/app/build/outputs/apk/release/app-release.apk"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -n 2
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "name='in.hdcareers.admin'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "versionCode='10'"
      - uses: actions/upload-artifact@v4
        with:
          name: HD-Careers-Existing-Admin-v1.3.4-ATS-Pilot-Signed
          path: android-admin/app/build/outputs/apk/release/app-release.apk
          retention-days: 14
