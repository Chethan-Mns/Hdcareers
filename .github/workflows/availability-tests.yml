name: Availability checker tests
on:
  pull_request:
    paths:
      - 'scripts/check_job_availability.py'
      - 'scripts/admin_publish.py'
      - 'tests/test_job_availability.py'
      - 'tests/test_admin_publish_partial.py'
      - '.github/workflows/availability-tests.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/check_job_availability.py'
      - 'scripts/admin_publish.py'
      - 'tests/test_admin_publish_partial.py'
      - 'tests/test_job_availability.py'
      - '.github/workflows/availability-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run availability unit tests
        run: python3 -m unittest discover -s tests -p 'test_job_availability.py' && python3 -m unittest discover -s tests -p 'test_admin_publish_partial.py'
