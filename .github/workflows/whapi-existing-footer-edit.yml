name: HD Careers One-Time Existing WhatsApp Footer Edit

on:
  push:
    branches: [main]
    paths:
      - data/whapi-old-footer-edit-request.json

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  edit-old-test-posts:
    if: startsWith(github.event.head_commit.message, 'Edit the two old HD Careers WhatsApp footers')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WHAPI_TOKEN: ${{ secrets.WHAPI_TOKEN }}
      WHAPI_CHANNEL_ID: ${{ secrets.WHAPI_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact two prior-test receipts and old-post edit safety
        run: |
          python3 -m py_compile scripts/edit_whapi_legacy_footer.py
          python3 -m unittest discover -s tests -p test_whapi_channel_relay.py -v
          git fetch origin main
          git reset --hard origin/main
      - name: Precommit one-time claims BEFORE editing existing Channel messages
        id: claim
        run: |
          set -euo pipefail
          python3 scripts/edit_whapi_legacy_footer.py claim
          git config user.name 'HD Careers Whapi Footer Editor'
          git config user.email 'actions@users.noreply.github.com'
          git add data/whapi-old-footer-edits.json
          git commit -m 'Claim existing Whapi footer edits before provider request'
          git push origin HEAD:main
      - name: Edit original Channel messages (never repost)
        if: steps.claim.outputs.claimed == 'true'
        run: python3 scripts/edit_whapi_legacy_footer.py edit
      - name: Persist editing results even when provider denies editing
        if: always() && steps.claim.outputs.claimed == 'true'
        run: |
          set -euo pipefail
          git add data/whapi-old-footer-edits.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record one-time existing WhatsApp footer edit outcomes'
            git push origin HEAD:main
          fi
      - name: Retain edit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whapi-two-existing-footer-edit-evidence
          path: data/whapi-old-footer-edits.json
          retention-days: 30
