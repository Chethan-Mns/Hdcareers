name: Publish Main Job Data

on:
  push:
    branches:
      - main
    paths:
      - data/jobs.json
      - generate.py

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message != 'Publish jobs from HD Careers Admin' && github.event.head_commit.message != 'Generate website for verified jobs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify new job availability
        run: python3 scripts/check_job_availability.py --before "${{ github.event.before }}" --prune-unverified-new

      - name: Queue new jobs for Telegram
        run: python3 scripts/telegram_queue.py enqueue "${{ github.event.before }}"

      - name: Generate homepage and job pages
        run: python3 generate.py

      - name: Post newly submitted job to Telegram immediately
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/post_telegram_from_push.py "${{ github.event.before }}"

      - name: Validate generated output
        run: |
          git diff --check
          python3 generate.py --dry-run

      - name: Commit generated website and Telegram queue
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated website is already current."
          else
            git config user.name "HD Careers Automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/jobs.json data/telegram-queue.json index.html jobs/ insights.html insights/ robots.txt sitemap.xml
            git commit -m "Generate website for verified jobs"
            git push origin HEAD:main
          fi
