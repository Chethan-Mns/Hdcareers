name: Publish Main Job Data

on:
  push:
    branches:
      - main
    paths:
      - data/jobs.json
      - generate.py

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message != 'Publish jobs from HD Careers Admin' && github.event.head_commit.message != 'Generate website for verified jobs' && github.event.head_commit.message != 'Update Telegram posting queue' && !startsWith(github.event.head_commit.message, 'Admin review active:')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify new job availability
        run: python3 scripts/check_job_availability.py --before "${{ github.event.before }}" --prune-unverified-new

      - name: Queue new jobs for Telegram
        run: python3 scripts/telegram_queue.py enqueue "${{ github.event.before }}"

      - name: Generate homepage and job pages
        run: python3 generate.py

      - name: Validate generated output
        run: |
          git diff --check
          python3 generate.py --dry-run

      - name: Commit and deploy generated website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HD Careers Automation"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6 7 8; do
            git add data/jobs.json data/review-queue.json data/telegram-queue.json index.html jobs/ insights.html insights/ robots.txt sitemap.xml

            if git diff --cached --quiet; then
              echo "Generated website is already current."
              exit 0
            fi

            git commit -m "Generate website for verified jobs"

            if git push origin HEAD:main; then
              echo "Generated website published."
              exit 0
            fi

            echo "::warning::main changed during website generation. Rebuilding from the latest main (attempt ${attempt}/8)."
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/check_job_availability.py --before "${{ github.event.before }}" --prune-unverified-new
            python3 scripts/telegram_queue.py enqueue "${{ github.event.before }}"
            python3 generate.py
            git diff --check
            sleep 3
          done

          echo "::error::Could not publish generated website after 8 safe retries because main kept changing."
          exit 1

      - name: Post manual job to Telegram after deployment
        if: startsWith(github.event.head_commit.message, 'Manual publish:')
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_queue.py publish-new "${{ github.event.before }}"

      - name: Save immediate Telegram state
        if: startsWith(github.event.head_commit.message, 'Manual publish:')
        shell: bash
        run: |
          if git diff --quiet -- data/telegram-queue.json; then
            echo "No Telegram queue state change."
          else
            git config user.name "HD Careers Automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/telegram-queue.json
            git commit -m "Update Telegram posting queue"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
