name: Publish Main Job Data

on:
  push:
    branches:
      - main
    paths:
      - data/jobs.json

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message != 'Publish jobs from HD Careers Admin'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify new job availability
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: python3 scripts/check_job_availability.py --before "$BEFORE_SHA"

      - name: Generate homepage and job pages
        run: python3 generate.py

      - name: Validate generated output
        run: |
          git diff --check
          python3 generate.py --dry-run

      - name: Commit generated website files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated website is already current."
          else
            git config user.name "HD Careers Automation"
            git config user.email "actions@users.noreply.github.com"
            git add index.html jobs/ robots.txt sitemap.xml
            git commit -m "Generate website for published jobs"
            git push origin HEAD:main
          fi

      - name: Post new jobs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/post_telegram_from_push.py "${{ github.event.before }}"
