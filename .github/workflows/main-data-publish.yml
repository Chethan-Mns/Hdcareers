name: Publish Main Job Data

on:
  push:
    branches:
      - main
    paths:
      - data/jobs.json
      - generate.py

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.head_commit.message != 'Publish jobs from HD Careers Admin' && github.event.head_commit.message != 'Generate website for verified jobs'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve publish batch baseline
        shell: bash
        env:
          EVENT_BEFORE_SHA: ${{ github.event.before }}
        run: |
          BASE_SHA="$(git log "$EVENT_BEFORE_SHA" --first-parent --format='%H%x09%s' | awk -F '\t' '$2 == "Generate website for verified jobs" {print $1; exit}')"
          if [ -z "$BASE_SHA" ]; then
            BASE_SHA="$EVENT_BEFORE_SHA"
          fi
          echo "BATCH_BASE_SHA=$BASE_SHA" >> "$GITHUB_ENV"
          echo "Publishing jobs added since $BASE_SHA"

      - name: Verify new job availability
        run: python3 scripts/check_job_availability.py --before "$BATCH_BASE_SHA" --prune-unverified-new

      - name: Generate homepage and job pages
        run: python3 generate.py

      - name: Validate generated output
        run: |
          git diff --check
          python3 generate.py --dry-run

      - name: Commit generated website files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated website is already current."
          else
            git config user.name "HD Careers Automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/jobs.json index.html jobs/ robots.txt sitemap.xml
            git commit -m "Generate website for verified jobs"
            git push origin HEAD:main
          fi

      - name: Post new jobs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/post_telegram_from_push.py "$BATCH_BASE_SHA"
