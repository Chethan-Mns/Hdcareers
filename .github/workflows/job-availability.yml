name: Check published job availability
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/job-availability.yml
      - scripts/check_job_availability.py
      - data/availability-trigger.json
  schedule:
    # 08:15 and 20:15 Asia/Kolkata.
    - cron: '45 2,14 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: main-job-data-publish
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official sources and close confirmed expired jobs
        run: python3 scripts/check_job_availability.py --write
      - name: Audit listing content for review
        run: python3 scripts/check_content_quality.py
      - name: Regenerate pages using existing expired design
        run: |
          python3 generate.py
          git diff --check
      - name: Save closure updates safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HD Careers Automation'
          git config user.email 'actions@users.noreply.github.com'

          for attempt in 1 2 3; do
            git add data/jobs.json data/availability-status.json data/review-queue.json index.html jobs/ robots.txt sitemap.xml

            if git diff --cached --quiet; then
              echo "No website changes to publish."
              exit 0
            fi

            git commit -m 'Close confirmed expired job listings'

            if git push origin HEAD:main; then
              echo "Availability updates published."
              exit 0
            fi

            echo "::warning::main changed while the checker was running. Refreshing from the latest main and retrying safely (attempt ${attempt}/3)."
            git fetch origin main
            git reset --hard origin/main

            python3 scripts/check_job_availability.py --write
            python3 scripts/check_content_quality.py
            python3 generate.py
            git diff --check
          done

          echo "::error::Could not publish checker updates after 3 safe retries because main kept changing."
          exit 1
      - name: Retain check evidence and uncertain sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: job-availability-report
          path: availability-report.json
          retention-days: 30
      - name: Retain content quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-quality-report
          path: content-quality-report.json
          retention-days: 30
      - name: Show review queue
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          rows = json.loads(Path('availability-report.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Job availability checks\n')
              for row in rows:
                  out.write(f"- Job {row['id']}: {row['state']} — {row['reason']}\n")
          if any(r['state'] == 'review' for r in rows):
              print('::warning::Some official sources require manual review. See job-availability-report.')
          PY
