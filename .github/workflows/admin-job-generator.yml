name: Admin Direct Publish

on:
  repository_dispatch:
    types:
      - admin_publish_jobs
  push:
    branches:
      - main
    paths:
      - data/approved-review-publication.json
      - data/owner-approved-ten-20261012.json
      - data/discovery-v3-ey-pilot-approval.json
      - data/owner-reviewed-publish-retry-20261013.json
      - data/vip-publish-request.json

permissions:
  contents: write
  actions: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install logo quality dependency
        run: python3 -m pip install --disable-pip-version-check "Pillow>=11,<13"

      - name: Prepare exact approved jobs on push
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx 'data/vip-publish-request.json'; then
            cp data/vip-publish-request.json /tmp/hd-reviewed-publish-event.json
          elif git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx 'data/owner-reviewed-publish-retry-20261013.json'; then
            python3 scripts/prepare_submitted_oct13.py /tmp/hd-reviewed-publish-event.json
          elif git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx 'data/discovery-v3-ey-pilot-approval.json'; then
            python3 scripts/prepare_v3_ey_pilot.py /tmp/hd-reviewed-publish-event.json
          elif git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -qx 'data/owner-approved-ten-20261012.json'; then
            python3 scripts/prepare_owner_approved_ten_20261012.py /tmp/hd-reviewed-publish-event.json
          else
            python3 scripts/prepare_review_publication.py data/approved-review-publication.json /tmp/hd-reviewed-publish-event.json
          fi

      - name: Add selected jobs
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            approved_event="/tmp/hd-reviewed-publish-event.json"
          else
            approved_event="$GITHUB_EVENT_PATH"
          fi
          python3 scripts/admin_publish.py "$approved_event"

      - name: Queue approved multi-job batch for hourly delivery
        id: hourly
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            approved_event="/tmp/hd-reviewed-publish-event.json"
          else
            approved_event="$GITHUB_EVENT_PATH"
          fi
          python3 scripts/hourly_telegram.py enqueue "$approved_event"

      - name: Resolve logos from official employer websites (not ATS platforms)
        run: python3 scripts/resolve_company_logos.py

      - name: Verify employer brand source and SVG safety
        run: python3 -m unittest discover -s tests -p test_employer_brand_sources.py -v

      - name: Generate homepage and job pages
        run: python3 generate.py

      - name: Validate generated output
        run: |
          python3 -m unittest discover -s tests -p test_job_hero.py -v
          git diff --check
          python3 generate.py --dry-run

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HD Careers Admin"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6 7 8; do
            git add data/jobs.json data/insights-summary.json data/company-logos.json data/company-logo-review.json data/review-queue.json data/telegram-hourly-queue.json assets/company-icons index.html jobs/ insights.html insights/ robots.txt sitemap.xml data/telegram-approved-batch.json

            if git diff --cached --quiet; then
              echo "No changes to publish."
              exit 0
            fi

            git commit -m "Publish jobs from HD Careers Admin"

            if git push origin HEAD:main; then
              echo "Admin publishing changes saved."
              exit 0
            fi

            echo "::warning::main changed during admin publishing. Rebuilding from latest main (attempt ${attempt}/8)."
            git fetch origin main
            git reset --hard origin/main
            if [ "$GITHUB_EVENT_NAME" = "push" ]; then
              python3 scripts/admin_publish.py "$approved_event"
            else
              python3 scripts/admin_publish.py "$GITHUB_EVENT_PATH"
            fi
            python3 scripts/resolve_company_logos.py
            python3 generate.py
            git diff --check
            sleep 3
          done

          echo "::error::Could not save admin publishing changes after 8 safe retries because main kept changing."
          exit 1

      - name: Claim first hourly job after approved website publication
        if: steps.hourly.outputs.deferred == 'true'
        id: first_claim
        shell: bash
        run: |
          python3 scripts/hourly_telegram.py prime
          git add data/telegram-hourly-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Claim first approved hourly Telegram job"
            git push origin HEAD:main
          fi
      - name: Send first approved job immediately after website deployment
        if: steps.hourly.outputs.deferred == 'true' && steps.first_claim.outputs.claimed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/hourly_telegram.py send
      - name: Deliver admin-approved jobs to Telegram after deployment
        if: steps.hourly.outputs.deferred != 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if python3 -c 'import json,os; p=json.load(open("data/telegram-approved-batch.json")); exit(0 if p.get("batchId") == "admin-"+os.environ["GITHUB_RUN_ID"] else 1)'; then
            python3 scripts/publish_approved_telegram.py
          else
            echo "No newly approved jobs to send."
          fi
      - name: Save confirmed Telegram delivery receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/telegram-deliveries.json ]; then exit 0; fi
          snapshot="$RUNNER_TEMP/hd-telegram-receipts-$GITHUB_RUN_ID.json"
          queue_snapshot="$RUNNER_TEMP/hd-telegram-hourly-$GITHUB_RUN_ID.json"
          cp data/telegram-deliveries.json "$snapshot"
          cp data/telegram-hourly-queue.json "$queue_snapshot"
          git config user.name "HD Careers Telegram"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/merge_telegram_delivery_receipts.py "$snapshot" data/telegram-deliveries.json
            python3 scripts/hourly_telegram.py merge "$queue_snapshot"
            git add data/telegram-deliveries.json data/telegram-hourly-queue.json
            if git diff --cached --quiet; then
              echo "Delivery receipts already saved to main."
              exit 0
            fi
            git commit -m "Record confirmed Telegram delivery receipts"
            if git push origin HEAD:main; then
              echo "Telegram delivery receipts persisted, without reposting messages."
              exit 0
            fi
            echo "::warning::main advanced during receipt sync (attempt ${attempt}/8). Merging again safely."
            sleep 2
          done
          echo "::error::Could not persist Telegram receipts; download workflow evidence before retry."
          exit 1
      - name: Arm reliable follow-up wake after the first confirmed Telegram post
        if: success() && steps.hourly.outputs.deferred == 'true' && steps.first_claim.outputs.claimed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Do not re-publish anything here: dispatch a clock/wakeup only.
          # The new workflow rechecks the actual saved receipt and dueAt.
          python3 - <<'PY'
          import json,os
          batch="admin-"+os.environ["GITHUB_RUN_ID"]
          queue=json.load(open("data/telegram-hourly-queue.json"))["items"]
          delivered=[i for i in queue if i.get("batchId")==batch and i.get("status")=="delivered"]
          if not delivered or not all(i.get("messageId") and i.get("deliveredAt") for i in delivered):
              raise SystemExit("First post not durably confirmed; do not arm hourly relay")
          print("Confirmed first delivery:", delivered[0]["page"],delivered[0]["messageId"])
          PY
          for attempt in 1 2 3 4 5; do
            if gh workflow run hourly-telegram-queue.yml --ref main --field relay=true; then
              echo "Hourly follow-up relay armed."
              exit 0
            fi
            echo "::warning::Telegram relay dispatch failed (attempt $attempt/5)."
            sleep 12
          done
          echo "::error::First post delivered but hourly follow-up wake could not be armed."
          exit 1
      - name: Notify registered Android admins of publishing outcome
        if: always()
        env:
          PUSH_SECRET: ${{ secrets.ANDROID_PUSH_DISPATCH_SECRET }}
          PUBLISH_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -uo pipefail
          if [ "${#PUSH_SECRET}" -lt 32 ]; then
            echo "::warning::Android push secret missing; publishing receipts remain authoritative."
            exit 0
          fi
          if ! python3 -c 'import json,os; p=json.load(open("data/telegram-approved-batch.json")); exit(0 if p.get("approved") and p.get("pages") and p.get("batchId")=="admin-"+os.environ["GITHUB_RUN_ID"] else 1)'; then
            echo "No new approved batch in this workflow; no push."
            exit 0
          fi
          status="$PUBLISH_STATUS"
          if [ "$status" != success ]; then status=failure; fi
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 \
            -H "Content-Type: application/json" \
            -H "x-hd-push-key: $PUSH_SECRET" \
            --data "$(jq -cn --arg id "admin-$GITHUB_RUN_ID" --arg status "$status" '{action:"notify_publishing",batchId:$id,publishStatus:$status}')" \
            "https://hdcareers.in/api/admin/android-devices" \
            || echo "::warning::Publishing push failed; do not retry publishing because the push failed."
      - name: Upload Telegram delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-telegram-delivery-evidence
          path: data/telegram-deliveries.json
          if-no-files-found: ignore
          retention-days: 30
