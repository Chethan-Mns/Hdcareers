name: Admin Direct Publish

on:
  repository_dispatch:
    types:
      - admin_publish_jobs

permissions:
  contents: write

concurrency:
  group: admin-direct-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add selected jobs
        run: python3 scripts/admin_publish.py "$GITHUB_EVENT_PATH"

      - name: Generate homepage and job pages
        run: python3 generate.py

      - name: Validate generated output
        run: |
          git diff --check
          python3 generate.py --dry-run

      - name: Commit directly to main
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "HD Careers Admin"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json index.html jobs/ robots.txt sitemap.xml
          git commit -m "Publish jobs from HD Careers Admin"
          git push origin HEAD:main

      - name: Post published jobs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/post_telegram.py "$GITHUB_EVENT_PATH"
