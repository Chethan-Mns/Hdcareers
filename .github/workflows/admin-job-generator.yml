name: Admin Direct Publish

on:
  repository_dispatch:
    types:
      - admin_publish_jobs

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add selected jobs
        run: python3 scripts/admin_publish.py "$GITHUB_EVENT_PATH"

      - name: Resolve official company favicons
        run: python3 scripts/resolve_company_logos.py

      - name: Generate homepage and job pages
        run: python3 generate.py

      - name: Validate generated output
        run: |
          git diff --check
          python3 generate.py --dry-run

      - name: Commit directly to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HD Careers Admin"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3 4 5 6 7 8; do
            git add data/jobs.json data/company-logos.json data/review-queue.json assets/company-icons index.html jobs/ robots.txt sitemap.xml

            if git diff --cached --quiet; then
              echo "No changes to publish."
              exit 0
            fi

            git commit -m "Publish jobs from HD Careers Admin"

            if git push origin HEAD:main; then
              echo "Admin publishing changes saved."
              exit 0
            fi

            echo "::warning::main changed during admin publishing. Rebuilding from latest main (attempt ${attempt}/8)."
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/admin_publish.py "$GITHUB_EVENT_PATH"
            python3 scripts/resolve_company_logos.py
            python3 generate.py
            git diff --check
            sleep 3
          done

          echo "::error::Could not save admin publishing changes after 8 safe retries because main kept changing."
          exit 1

      - name: Post published jobs to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python3 scripts/post_telegram.py "$GITHUB_EVENT_PATH"
