name: Temporary Premium Replica Generator
on:
  push:
    branches:
      - preview/final-replica-20261021
    paths:
      - .github/workflows/premium-preview-refresh.yml
permissions:
  contents: write
jobs:
  preview-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate production-shaped preview
        run: |
          python3 -m py_compile generate.py
          python3 generate.py
          git diff --check
          python3 generate.py --dry-run
      - name: Commit generated preview pages
        run: |
          git config user.name "HD Careers Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html insights.html insights/weekly-hiring-insights.html data/insights-summary.json jobs/ sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Render refined owner-review homepage and Insights from job data"
            git push origin HEAD:preview/final-replica-20261021
          fi
