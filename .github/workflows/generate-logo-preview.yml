name: Generate Logo Preview Branch

on:
  push:
    branches:
      - preview/careers-favicon-logo-system
    paths:
      - generate.py
      - data/jobs.json
      - index.html
      - api/admin/extract-job.js
      - api/admin/publish.js
      - admin/index.html
      - ios-admin/**
      - .github/workflows/generate-logo-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-logo-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/careers-favicon-logo-system
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate site
        run: python3 generate.py

      - name: Commit generated preview
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated preview is already current."
            exit 0
          fi
          git config user.name "HD Careers Preview"
          git config user.email "actions@users.noreply.github.com"
          git add index.html jobs/ robots.txt sitemap.xml
          git commit -m "Generate careers favicon preview"
          git push origin HEAD:preview/careers-favicon-logo-system
