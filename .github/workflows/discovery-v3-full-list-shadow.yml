name: HD Careers V3 full-list discovery shadow
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/discovery_v3_full_list.py
      - tests/test_discovery_v3_wipro.py
      - scripts/discovery_v3_shadow.py
      - tests/test_discovery_v3_full_list.py
      - scripts/discovery_v3_gate.py
      - tests/test_discovery_v3_gate.py
      - scripts/discovery_v3_source_registry.py
      - tests/test_discovery_v3_registry.py
      - scripts/discovery_v3_draft.py
      - tests/test_discovery_v3_draft.py
      - .github/workflows/discovery-v3-full-list-shadow.yml
  schedule:
    # Read-only shadow at approximately 08:30 IST; no publishing.
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Maximum official listing pages per employer (1-400). A limited scan is PARTIAL, never a completed expiry check."
        required: false
        default: "2"
      verify_new:
        description: "Verify this many newly discovered exact job pages (0-5)"
        required: false
        default: "3"
permissions:
  contents: read
  actions: read
concurrency:
  group: hd-v3-discovery-shadow
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify pagination, duplicate and expiry safety rules
        run: |
          python3 -m py_compile scripts/discovery_v3_full_list.py
          python3 -m unittest discover -s tests -p 'test_discovery_v3_full_list.py' -v
          python3 -m unittest discover -s tests -p 'test_discovery_v3_wipro.py' -v
          python3 -m unittest discover -s tests -p 'test_discovery_v3_gate.py' -v
          python3 -m unittest discover -s tests -p 'test_discovery_v3_registry.py' -v
          python3 -m unittest discover -s tests -p 'test_discovery_v3_draft.py' -v
      - name: Read-only current employer discovery
        env:
          MAX_PAGES: ${{ inputs.max_pages || (github.event_name == 'schedule' && '6' || '2') }}
          VERIFY_NEW: ${{ inputs.verify_new || (github.event_name == 'schedule' && '4' || '3') }}
        run: |
          python3 scripts/discovery_v3_full_list.py --max-pages "$MAX_PAGES" --verify-new "$VERIFY_NEW" --output discovery-v3-full-list-report.json
      - name: Separate Wipro full-list shadow trial
        run: |
          python3 scripts/discovery_v3_full_list.py --companies Wipro --max-pages 2 --verify-new 2 --output discovery-v3-wipro-report.json
          python3 - <<'PY'
          import json
          report=json.load(open("discovery-v3-wipro-report.json"))
          assert report["mode"]=="shadow_only"
          assert len(report["scans"])==1 and report["scans"][0]["employer"]=="Wipro"
          assert len(report["scans"][0]["jobs"])==len(set(report["scans"][0]["ids"]))
          print("Wipro probe status:",report["scans"][0]["status"],
                "jobs:",len(report["scans"][0]["jobs"]))
          PY
      - name: Validate shadow report fail-closed contract
        run: |
          python3 - <<'PY'
          import json
          with open("discovery-v3-full-list-report.json") as fd:
              data=json.load(fd)
          assert data["mode"]=="shadow_only"
          assert len(data["scans"])==3
          for scan in data["scans"]:
              assert scan["status"] in ("ok","partial")
              assert scan["complete"] or scan["status"]=="partial"
              assert len(scan["jobs"])==len(set(scan["ids"]))
              if not scan["complete"]:
                  print("Incomplete job listing held from expiry decisions:",scan["employer"],scan["problems"])
          print("V3 verification report validated. No production jobs mutated.")
          PY
      - name: Collect previous independent shadow reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v3-history
          python3 - <<'PY'
          import json,os,subprocess
          from pathlib import Path
          cmd=["gh","run","list","--repo",os.environ["GITHUB_REPOSITORY"],
               "--workflow","discovery-v3-full-list-shadow.yml",
               "--limit","15","--json","databaseId,conclusion,createdAt"]
          try:
              runs=json.loads(subprocess.check_output(cmd,text=True,timeout=30))
          except (subprocess.SubprocessError,ValueError,OSError) as error:
              print("History unavailable; quality gate remains blocked:",type(error).__name__)
              runs=[]
          count=0
          for item in runs:
              if item.get("conclusion")!="success" or str(item.get("databaseId"))==os.environ["GITHUB_RUN_ID"]:
                  continue
              target=Path("/tmp/v3-history")/str(item["databaseId"])
              target.mkdir(parents=True,exist_ok=True)
              command=["gh","run","download",str(item["databaseId"]),
                       "--repo",os.environ["GITHUB_REPOSITORY"],
                       "--name","hd-careers-v3-full-list-evidence",
                       "--dir",str(target)]
              try:
                  subprocess.run(command,check=True,stdout=subprocess.DEVNULL,
                                 stderr=subprocess.DEVNULL,timeout=40)
                  if (target/"discovery-v3-full-list-report.json").is_file():
                      count+=1
                  else:
                      print("Prior run contained no complete report:",item["databaseId"])
              except (subprocess.SubprocessError,OSError):
                  print("Prior report could not be read:",item["databaseId"])
              if count>=5: break
          print("Previous shadow reports collected:",count)
          PY
      - name: Conservative quality gate (never publishes or expires)
        run: |
          python3 - <<'PY'
          import glob,json
          from pathlib import Path
          from sys import path
          path.insert(0,"scripts")
          from discovery_v3_gate import inspect_history
          files=glob.glob("/tmp/v3-history/*/discovery-v3-full-list-report.json")
          reports=[]
          for file in files:
              try: reports.append(json.loads(Path(file).read_text()))
              except (ValueError,OSError): continue
          reports.append(json.loads(Path("discovery-v3-full-list-report.json").read_text()))
          outcome=inspect_history(reports)
          Path("discovery-v3-quality-gate.json").write_text(json.dumps(outcome,indent=2)+"\n")
          print("Evidence:",len(reports),"reports")
          for company,value in outcome["employers"].items():
              print(company,value["status"],value["reasons"])
          print("Publishing remains disabled:",not outcome["safeToEnableAutomaticPublishing"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hd-careers-v3-full-list-evidence
          path: |
            discovery-v3-full-list-report.json
            discovery-v3-quality-gate.json
            discovery-v3-wipro-report.json
          retention-days: 14
