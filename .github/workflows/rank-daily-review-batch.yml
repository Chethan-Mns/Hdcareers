name: Rank 9AM discovery shortlist from official evidence
on:
  push:
    branches: [main]
    paths:
      - data/daily-review-batch.json
      - lib/review-ranking.js
      - scripts/reprioritize_review_batch.mjs
      - scripts/preflight_review_content.py
      - scripts/recover_daily_review_content.mjs
      - .github/workflows/rank-daily-review-batch.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hd-daily-review-ranking
  cancel-in-progress: false
jobs:
  rank:
    if: github.event_name == 'workflow_dispatch' || !startsWith(github.event.head_commit.message, 'Admin review:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit test quality rules
        run: node --test tests/review-ranking.test.mjs
      - name: Re-rank only if no manual reviews exist
        run: node scripts/reprioritize_review_batch.mjs data/daily-review-batch.json --apply
      - name: Normalize official job categories before owner review
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/daily-review-batch.json")
          d=json.loads(p.read_text())
          all_jobs=(d.get("priority") or [])+(d.get("backup") or [])
          if d.get("status")!="reviewing" or any(x.get("reviewedAt") for x in all_jobs):
              print("Existing owner review is immutable; no category changes.")
          else:
              aliases={"non-it":"nonit","non it":"nonit","it & software":"it","it / software":"it"}
              count=0
              for c in all_jobs:
                  j=c.get("job") or {}
                  before=str(j.get("cat") or "").strip()
                  after=aliases.get(before.lower(),before)
                  if before!=after:
                      j["cat"]=after
                      count+=1
              if count:
                  p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+"\n")
              print(f"Normalized {count} publisher category labels; no employer or owner decisions changed.")
          PY
      - name: Validate revised shortlist contract
        run: python3 scripts/validate_daily_review_batch.py data/daily-review-batch.json
      - name: Enforce 20 new employers and 6-2-2 quotas before owner review
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          batch=json.loads(Path("data/daily-review-batch.json").read_text())
          candidates=(batch.get("priority") or [])+(batch.get("backup") or [])
          if batch.get("status")=="reviewing" and not any(x.get("reviewedAt") for x in candidates):
              subprocess.run(["python3","scripts/validate_daily_review_batch.py","--strict-discovery"],check=True)
          else:
              print("Owner-reviewed or historical batch: preserve existing decisions; quota applies to future discovery.")
          PY
      - name: Recover missing fields from exact official job pages
        timeout-minutes: 8
        run: node scripts/recover_daily_review_content.mjs data/daily-review-batch.json --apply
      - name: Source-backed content preflight
        run: python3 scripts/preflight_review_content.py data/daily-review-batch.json --output /tmp/content-readiness.json
      - name: Attach review readiness report
        uses: actions/upload-artifact@v4
        with:
          name: hd-daily-content-readiness
          path: /tmp/content-readiness.json
          retention-days: 7
      - name: Safely commit revised shortlist
        run: |
          git diff --check
          if git diff --quiet -- data/daily-review-batch.json && ! test -f data/daily-review-source-recheck.json; then exit 0; fi
          git config user.name "HD Careers Review Quality"
          git config user.email "actions@users.noreply.github.com"
          git add data/daily-review-batch.json
          if [ -f data/daily-review-source-recheck.json ]; then git add data/daily-review-source-recheck.json; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Rank and enrich daily shortlist from official sources"
          git push origin HEAD:main
