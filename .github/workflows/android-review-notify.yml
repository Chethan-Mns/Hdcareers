name: Android Daily Review Push Notification

on:
  push:
    branches: [main]
    paths:
      - data/daily-review-batch.json
  workflow_dispatch:

permissions:
  contents: write

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify newly generated review batch
        id: scan
        shell: bash
        run: |
          python3 - <<'PY'
          import json,subprocess,datetime,os,sys
          from pathlib import Path
          p=Path("data/daily-review-batch.json")
          if not p.exists():sys.exit(0)
          try:
              d=json.loads(p.read_text())
              previous=json.loads(subprocess.check_output(["git","show","HEAD^:data/daily-review-batch.json"],stderr=subprocess.DEVNULL))
          except Exception:
              sys.exit(0)
          if d.get("status")!="reviewing" or not d.get("batchId") or not d.get("verificationCheckedAt") or d.get("verificationCheckedAt")==previous.get("verificationCheckedAt"):sys.exit(0)
          priority,backup=d.get("priority",[]),d.get("backup",[])
          if not 1<=len(priority)+len(backup)<=20:sys.exit(0)
          try:
              generated=datetime.datetime.fromisoformat(d["generatedAt"].replace("Z","+00:00"))
          except Exception:
              sys.exit(0)
          now=datetime.datetime.now(datetime.timezone.utc)
          if not datetime.timedelta(0)<=now-generated<=datetime.timedelta(hours=3):sys.exit(0)
          sys.path.insert(0,"scripts")
          from validate_daily_review_batch import employer_key
          names=[employer_key(c.get("company") or c.get("job",{}).get("company")) for c in priority+backup]
          if not all(names) or len(set(names))!=len(names):sys.exit(0)
          from scripts.preflight_review_content import inspect
          readiness=inspect(d)
          if readiness["needsSourceContent"]:
              print("::error::Daily Android push blocked: "+str(readiness["needsSourceContent"])+" source-incomplete or employer-mismatched jobs. Prepare complete official job data BEFORE owner review.")
              for item in readiness["items"]:
                  if item["missing"]:
                      print("::error::"+str(item["company"])+": "+", ".join(item["missing"]))
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("notify=true\n")
              f.write("batch_id="+d["batchId"]+"\n")
          PY
      - name: Notify registered admin devices and record result
        if: steps.scan.outputs.notify == 'true'
        env:
          PUSH_SECRET: ${{ secrets.ANDROID_PUSH_DISPATCH_SECRET }}
          BATCH_ID: ${{ steps.scan.outputs.batch_id }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p data/testing
          code=000
          if [ "${#PUSH_SECRET}" -ge 32 ]; then
            code=$(curl --silent --show-error --retry 2 --max-time 35 -o /tmp/review-fcm.json -w '%{http_code}' \
              -H "Content-Type: application/json" \
              -H "x-hd-push-key: $PUSH_SECRET" \
              --data "$(jq -cn --arg batchId "$BATCH_ID" '{action:"notify_batch",batchId:$batchId}')" \
              "https://hdcareers.in/api/admin/android-devices") || code=000
          fi
          export HTTP_CODE="$code"
          python3 - <<'PY'
          import json,os,datetime
          from pathlib import Path
          body={}
          try:body=json.loads(Path("/tmp/review-fcm.json").read_text())
          except Exception:pass
          out={"batchId":os.environ.get("BATCH_ID"),"checkedAt":datetime.datetime.now(datetime.timezone.utc).isoformat(),
            "httpCode":os.environ.get("HTTP_CODE"),"fcmSent":body.get("sent",0),"fcmProcessed":body.get("processed",0),
            "fcmFailed":body.get("failed",0),"duplicateSuppressed":body.get("duplicate",False),
            "responseOk":os.environ.get("HTTP_CODE")=="200" and not body.get("duplicate",False),
            "note":"FCM acceptance is not proof that Android displayed the notification."}
          Path("data/testing/daily-review-fcm-receipt.json").write_text(json.dumps(out,indent=2)+"\n")
          print(json.dumps(out))
          PY
          git config user.name "HD Careers Push Receipt"
          git config user.email "actions@users.noreply.github.com"
          git add data/testing/daily-review-fcm-receipt.json
          if ! git diff --cached --quiet; then
            git commit -m "Record actual Firebase response for Android daily review batch"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
          if [ "$code" != 200 ]; then
            echo "::error::Daily Android push could not be confirmed, HTTP $code."
            exit 1
          fi
          echo "Firebase request made; check recorded device acceptance."
