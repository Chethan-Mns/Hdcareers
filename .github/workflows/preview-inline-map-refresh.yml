name: Temporary HD Careers Branded Preview Generator
on:
  push:
    branches:
      - preview/final-replica-20261021
    paths:
      - .github/workflows/preview-inline-map-refresh.yml
permissions:
  contents: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/final-replica-20261021
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate verified job + map data into HTML
        run: |
          python3 -m py_compile generate.py
          python3 generate.py
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          index=Path('index.html').read_text(encoding='utf-8')
          insight=Path('insights.html').read_text(encoding='utf-8')
          weekly=Path('insights/weekly-hiring-insights.html').read_text(encoding='utf-8')
          for name, html in [('index',index),('insight',insight),('weekly',weekly)]:
              x=re.search(r'<script type="application/json" id="hd-map-data">(.*?)</script>',html,re.S)
              assert x is not None, f'{name}: embedded city data missing'
              d=json.loads(x.group(1))
              assert len(d['cityPins'])>=10, f'{name}: too few city pins'
              assert d['cityPins'][0]['city']=='Bengaluru', f'{name}: unexpected data'
              print(name,'embedded city markers',len(d['cityPins']))
          assert index.index('id="filterTabs"') < index.index('id="expTypeFilter"')
          assert 'hi-art-mark' in insight and 'assets/hd-careers-logo.png' in insight
          print('map and hero assertions passed')
          PY
          git diff --check
          python3 generate.py --dry-run
      - name: Save rebuilt preview files only to review branch
        run: |
          git config user.name "HD Careers Preview Builder"
          git config user.email "actions@users.noreply.github.com"
          git add index.html insights.html insights/weekly-hiring-insights.html data/insights-summary.json jobs/ sitemap.xml robots.txt
          if ! git diff --cached --quiet; then
            git commit -m "Generate reliable city map and mobile branded preview"
            git push origin HEAD:preview/final-replica-20261021
          fi
