name: SuccessFactors shadow validation
on:
  push:
    branches:
      - job-verifier-v2-shadow
    paths:
      - 'scripts/successfactors_network_probe.py'
      - 'tests/fixtures/v2_universal_portal_manual_10.json'
      - '.github/workflows/successfactors-shadow.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chromium
        run: |
          python3 -m pip install playwright
          python3 -m playwright install chromium
      - name: Probe HCL and Wipro controls
        run: python3 scripts/successfactors_network_probe.py tests/fixtures/v2_universal_portal_manual_10.json
