name: 9AM Daily Review Batch integration tests

on:
  push:
    branches:
      - feature/9am-review-batch-handoff-20261011
      - feature/review-center-20-employers-flex-publish-20261011
    paths:
      - scripts/validate_daily_review_batch.py
      - lib/review-rules.js
      - tests/review-rules.test.mjs
      - tests/test_daily_review_batch.py
      - tests/daily-review-api.test.mjs
      - data/daily-review-batch.json
      - api/admin/daily-batch.js
      - api/admin/extract-job.js
      - lib/review-enrichment.js
      - lib/review-ranking.js
      - tests/review-ranking.test.mjs
      - scripts/reprioritize_review_batch.mjs
      - .github/workflows/rank-daily-review-batch.yml
      - tests/review-enrichment.test.mjs
      - api/admin/publish.js
      - admin/review-batch.html
      - .github/workflows/daily-review-batch-ci.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staged-review data and schema tests
        run: |
          python3 scripts/validate_daily_review_batch.py
          python3 -m py_compile scripts/prepare_owner_approved_ten_20261012.py
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          b=json.loads(Path("data/daily-review-batch.json").read_text())
          if b.get("batchId")!="2026-10-12-0900-ist":
              print("October 12 one-time publication preflight not applicable to a newer daily batch.")
          elif b.get("status")=="published":
              published=json.loads(Path("data/jobs.json").read_text())
              ledger=json.loads(Path("data/telegram-deliveries.json").read_text())
              batch_jobs={j["id"]:j for j in b["priority"]+b["backup"]}
              selected=b.get("publication",{}).get("candidateIds",[])
              assert len(selected)==10 and len(set(selected))==10
              published_urls={j["apply"]:j["page"] for j in published}
              pages=[published_urls[batch_jobs[id]["apply"]] for id in selected]
              assert len(set(pages))==10
              assert all(any(r.get("page")==page and r.get("status")=="delivered"
                  and r.get("batchId")=="admin-38209972992" for r in ledger.values()) for page in pages)
              print("Historical October 12 publication and Telegram receipts verified.")
          else:
              subprocess.run(["python3","scripts/prepare_owner_approved_ten_20261012.py","/tmp/hd-10-preflight.json"],check=True)
              jobs=json.loads(Path("/tmp/hd-10-preflight.json").read_text())["client_payload"]["jobs"]
              assert len(jobs)==10 and len({j["apply"] for j in jobs})==10
          PY
          python3 -m unittest discover -s tests -p test_daily_review_batch.py -v
          python3 -m unittest discover -s tests -p test_approved_nine_publication.py -v
      - name: Dry-run recovery of exact owner-reviewed October 13 batch
        run: |
          python3 -m py_compile scripts/prepare_submitted_oct13.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          from subprocess import run
          batch=json.loads(Path("data/daily-review-batch.json").read_text())
          if batch.get("batchId")=="2026-10-13-0900-ist" and batch.get("status")=="submitted":
              run(["python3","scripts/prepare_submitted_oct13.py","/tmp/hd-owner-13-publish.json"],check=True)
              payload=json.loads(Path("/tmp/hd-owner-13-publish.json").read_text())
              jobs=payload["client_payload"]["jobs"]
              assert len(jobs)==10 and len({j["apply"] for j in jobs})==10
              assert all(j["manualLiveVerifiedAt"] and j["manualLiveVerifiedUrl"]==j["apply"] for j in jobs)
              print("Exact ten owner-reviewed jobs pass a no-publish recovery dry-run.")
          else:
              print("October 13 approval is no longer pending; recovery remains single use.")
          PY
      - name: Validate API and browser scripts
        run: |
          node --check api/admin/daily-batch.js
          node --check api/admin/extract-job.js
          node --check lib/review-enrichment.js
          node --check scripts/recover_daily_review_content.mjs
          python3 -m py_compile scripts/preflight_review_content.py
          python3 -m unittest discover -s tests -p test_review_content_gate.py -v
          node --check lib/review-ranking.js
          node --check scripts/reprioritize_review_batch.mjs
          node --check api/admin/publish.js
          node --check lib/review-publish-proof.js
          node --test tests/review-publish-proof.test.mjs
          node --check lib/review-rules.js
          node --test tests/review-rules.test.mjs
          node --test tests/review-enrichment.test.mjs
          node --test tests/review-ranking.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text=Path("admin/review-batch.html").read_text()
          script=text.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/hd-review-inline.mjs").write_text(script)
          subprocess.run(["node","--check","/tmp/hd-review-inline.mjs"],check=True)
          assert 'id="readyTab"' in text
          assert 'Mark complete job' not in text
          PY
          node --test tests/daily-review-api.test.mjs
