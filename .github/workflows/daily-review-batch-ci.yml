name: 9AM Daily Review Batch integration tests

on:
  push:
    branches:
      - feature/9am-review-batch-handoff-20261011
      - feature/review-center-20-employers-flex-publish-20261011
    paths:
      - scripts/validate_daily_review_batch.py
      - lib/review-rules.js
      - tests/review-rules.test.mjs
      - tests/test_daily_review_batch.py
      - tests/daily-review-api.test.mjs
      - data/daily-review-batch.json
      - api/admin/daily-batch.js
      - api/admin/extract-job.js
      - lib/review-enrichment.js
      - lib/review-ranking.js
      - tests/review-ranking.test.mjs
      - scripts/reprioritize_review_batch.mjs
      - .github/workflows/rank-daily-review-batch.yml
      - tests/review-enrichment.test.mjs
      - api/admin/publish.js
      - admin/review-batch.html
      - .github/workflows/daily-review-batch-ci.yml
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate staged-review data and schema tests
        run: |
          python3 scripts/validate_daily_review_batch.py
          python3 -m py_compile scripts/prepare_owner_approved_ten_20261012.py
          python3 scripts/prepare_owner_approved_ten_20261012.py /tmp/hd-10-preflight.json
          python3 -c 'import json; p=json.load(open("/tmp/hd-10-preflight.json")); a=p["client_payload"]["jobs"]; assert len(a)==10 and len({v["apply"] for v in a})==10; assert all(v["manualLiveVerifiedUrl"]==v["apply"] and len(v["resp"])>0 for v in a); print("Ten verified-content drafts pass preflight")'
          python3 -m unittest discover -s tests -p test_daily_review_batch.py -v
          python3 -m unittest discover -s tests -p test_approved_nine_publication.py -v
      - name: Validate API and browser scripts
        run: |
          node --check api/admin/daily-batch.js
          node --check api/admin/extract-job.js
          node --check lib/review-enrichment.js
          node --check lib/review-ranking.js
          node --check scripts/reprioritize_review_batch.mjs
          node --check api/admin/publish.js
          node --check lib/review-rules.js
          node --test tests/review-rules.test.mjs
          node --test tests/review-enrichment.test.mjs
          node --test tests/review-ranking.test.mjs
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          text=Path("admin/review-batch.html").read_text()
          script=text.split("<script>",1)[1].split("</script>",1)[0]
          Path("/tmp/hd-review-inline.mjs").write_text(script)
          subprocess.run(["node","--check","/tmp/hd-review-inline.mjs"],check=True)
          assert 'id="readyTab"' in text
          assert 'Mark complete job' not in text
          PY
          node --test tests/daily-review-api.test.mjs
