name: Telegram Catch-up Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/telegram-catchup-once.yml

permissions:
  contents: write

concurrency:
  group: telegram-immediate-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Publish every legacy pending job now
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/telegram_queue.py publish-all

      - name: Save catch-up state
        shell: bash
        run: |
          if git diff --quiet -- data/telegram-queue.json; then
            echo "No legacy queue state change."
          else
            git config user.name "HD Careers Automation"
            git config user.email "actions@users.noreply.github.com"
            git add data/telegram-queue.json
            git commit -m "Complete Telegram catch-up"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
