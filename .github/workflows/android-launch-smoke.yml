name: Android Launch Smoke Test

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - android-admin/**
      - .github/workflows/android-launch-smoke.yml

permissions:
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          sudo chmod 666 /dev/kvm
      - name: Install on emulator and verify launch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            gradle -p android-admin --no-daemon :app:assembleDebug
            adb install -r android-admin/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n in.hdcareers.admin/.MainActivity
            sleep 12
            adb shell pidof in.hdcareers.admin || (adb logcat -d -s AndroidRuntime:E ActivityTaskManager:E && exit 1)
            adb exec-out screencap -p > "$GITHUB_WORKSPACE/android-login.png"
            adb logcat -d -s AndroidRuntime:E > "$GITHUB_WORKSPACE/android-startup-errors.log"
            ! grep -q "FATAL EXCEPTION" "$GITHUB_WORKSPACE/android-startup-errors.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HD-Android-Launch-Evidence
          path: |
            android-login.png
            android-startup-errors.log
          retention-days: 7
