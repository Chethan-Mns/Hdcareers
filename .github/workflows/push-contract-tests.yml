name: Push Notification Contract Tests

on:
  pull_request:
    branches: [main]
    paths:
      - lib/apns-client.js
      - lib/push-redis.js
      - api/admin/push-*.js
      - api/notifications/**
      - tests/push-contract.test.mjs
      - .github/workflows/push-contract-tests.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server endpoint syntax
        run: |
          node --check lib/apns-client.js
          node --check lib/push-redis.js
          node --check api/admin/push-devices.js
          node --check api/admin/push-test.js
          node --check api/notifications/dispatch.js
      - name: Run authentication, APNs JWT and device-storage regression tests
        run: node --experimental-default-type=module --test tests/push-contract.test.mjs
