name: Generate Editorial Preview

on:
  push:
    branches:
      - preview/careers-favicon-logo-system
    paths:
      - generate.py
      - data/jobs.json
      - index.html
      - career-resources.html
      - editorial-policy.html
      - resources/**
      - assets/editorial.css
      - .github/workflows/generate-editorial-preview.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-editorial-preview
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/careers-favicon-logo-system
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate site
        run: python3 generate.py
      - name: Commit generated preview
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated preview is already current."
            exit 0
          fi
          git config user.name "HD Careers Preview"
          git config user.email "actions@users.noreply.github.com"
          git add index.html jobs/ insights.html insights/ sitemap.xml robots.txt
          git commit -m "Generate editorial and insights preview"
          git push origin HEAD:preview/careers-favicon-logo-system
