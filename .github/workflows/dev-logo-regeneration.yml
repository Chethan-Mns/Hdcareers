name: Dev-only generate employer-brand job pages

on:
  pull_request:
    branches: [main]
    paths:
      - 'generate.py'
      - 'data/company-logo-domains.json'
      - 'data/company-careers-portals.json'
      - '.github/workflows/dev-logo-regeneration.yml'

permissions:
  contents: write

jobs:
  regenerate-in-development-only:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'dev/verification-precision-expiry-branding-20261018'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev/verification-precision-expiry-branding-20261018
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate static HTML using new employer-first image fallback
        run: |
          python3 generate.py --dry-run
          python3 generate.py
          git diff --check
      - name: Commit generated pages only to feature branch
        env:
          BRANCH: dev/verification-precision-expiry-branding-20261018
        run: |
          set -euo pipefail
          test "$BRANCH" != main
          git config user.name "hd-careers-dev-regenerator"
          git config user.email "actions@users.noreply.github.com"
          git add index.html jobs/ insights.html insights/ sitemap.xml robots.txt
          if git diff --cached --quiet; then
            echo "Generated files already consistent."
            exit 0
          fi
          git commit -m "DEV: regenerate employer-brand job pages; no production changes"
          git push origin "HEAD:$BRANCH"
