name: Generator Check

on:
  pull_request:
    branches:
      - main

jobs:
  generator-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test JD keyword matching
        run: |
          node tests/resume-keywords.test.js
          node tests/resume-assessment.test.js

      - name: Validate admin and analytics JavaScript
        run: |
          node --check api/admin/review.js
          node --check api/admin/extract-job.js
          node --check api/admin/publish.js
          node --check api/admin/traffic.js
          node --check assets/analytics.js

      - name: Phase 1 verification and failure-safety regression tests
        run: |
          python3 -m unittest discover -s tests -p test_phase1_safety.py -v
          python3 -m unittest discover -s tests -p test_phase3_pilot.py -v
          python3 -m unittest discover -s tests -p test_phase4_growth.py -v
          python3 -m unittest discover -s tests -p test_phase1_delivery.py -v
          python3 -m unittest discover -s tests -p test_job_availability.py -v
          python3 -m unittest discover -s tests -p test_telegram_approval.py -v

      - name: Validate admin inline JavaScript and stale-state guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          page = Path('admin/index.html').read_text()
          code = page.rsplit('<script>', 1)[-1].split('</script>', 1)[0]
          assert 'const stale=' in code and 'Status stale' in code
          Path('/tmp/hd-admin-inline.js').write_text(code)
          subprocess.run(['node','--check','/tmp/hd-admin-inline.js'], check=True)
          PY

      - name: Run generator
        run: python3 generate.py

      - name: Verify resume checker script escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = list(Path("jobs").glob("*.html"))
          assert pages, "No generated job pages found"
          bad = "text+='\n'"
          good = "text+='\\n'"
          for page in pages:
              body = page.read_text(encoding="utf-8")
              assert bad not in body, f"Broken inline JavaScript newline in {page}"
              if "async function readResumeFile" in body:
                  assert good in body, f"Missing escaped PDF newline in {page}"
          print(f"Checked {len(pages)} generated job pages")
          PY

      - name: Verify generated test page when present
        shell: bash
        run: |
          if grep -q '"page": "jobs/hd-careers-generator-test.html"' data/jobs.json; then
            test -f jobs/hd-careers-generator-test.html
            grep -q "jobs/hd-careers-generator-test.html" index.html
            grep -q "HD Careers Generator Test Role" jobs/hd-careers-generator-test.html
          fi

      - name: Verify trust and crawl files
        run: |
          test -f about.html
          test -f contact.html
          test -f privacy-policy.html
          test -f terms.html
          test -f disclaimer.html
          test -f robots.txt
          test -f sitemap.xml
          grep -q "Sitemap: https://hdcareers.in/sitemap.xml" robots.txt
          grep -q "https://hdcareers.in/privacy-policy.html" sitemap.xml

      - name: Phase 4 growth and trust audit
        run: python3 scripts/phase4_growth_audit.py --output phase4-growth-audit.json

      - name: Check generated output
        run: |
          git diff --check
          git diff --exit-code
