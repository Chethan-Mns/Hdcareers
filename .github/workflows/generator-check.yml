name: Generator Check

on:
  pull_request:
    branches:
      - main

jobs:
  generator-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test JD keyword matching
        run: |
          node tests/resume-keywords.test.js
          node tests/resume-assessment.test.js

      - name: Validate admin and analytics JavaScript
        run: |
          node --check api/admin/extract-job.js
          node --check api/admin/publish.js
          node --check api/admin/traffic.js
          node --check assets/analytics.js

      - name: Run generator
        run: python3 generate.py

      - name: Verify resume checker script escaping
        run: |
          python3 - <<'PY'
          from pathlib import Path
          pages = list(Path("jobs").glob("*.html"))
          assert pages, "No generated job pages found"
          bad = "text+='\n'"
          good = "text+='\\n'"
          for page in pages:
              body = page.read_text(encoding="utf-8")
              assert bad not in body, f"Broken inline JavaScript newline in {page}"
              if "async function readResumeFile" in body:
                  assert good in body, f"Missing escaped PDF newline in {page}"
          print(f"Checked {len(pages)} generated job pages")
          PY

      - name: Verify generated test page when present
        shell: bash
        run: |
          if grep -q '"page": "jobs/hd-careers-generator-test.html"' data/jobs.json; then
            test -f jobs/hd-careers-generator-test.html
            grep -q "jobs/hd-careers-generator-test.html" index.html
            grep -q "HD Careers Generator Test Role" jobs/hd-careers-generator-test.html
          fi

      - name: Verify trust and crawl files
        run: |
          test -f about.html
          test -f contact.html
          test -f privacy-policy.html
          test -f terms.html
          test -f disclaimer.html
          test -f robots.txt
          test -f sitemap.xml
          grep -q "Sitemap: https://hdcareers.in/sitemap.xml" robots.txt
          grep -q "https://hdcareers.in/privacy-policy.html" sitemap.xml

      - name: Check generated output
        run: |
          git diff --check
          git diff --exit-code
