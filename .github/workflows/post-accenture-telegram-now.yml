name: Post Accenture Telegram Now

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/post-accenture-telegram-now.yml

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Post Accenture job to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python3 - <<'PY'
          import json, os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          text = """Accenture is Hiring ✅

          <b>Role:</b> Data Engineer
          <b>Qualification:</b> 15 years full-time education
          <b>Experience:</b> 3+ years
          <b>Location:</b> Pune / Bengaluru

          Apply Link: https://hdcareers.in/jobs/accenture-data-engineer-atci-5478225.html

          𝗝𝗼𝗶𝗻 𝗢𝘂𝗿 𝗪𝗵𝗮𝘁𝘀𝗔𝗽𝗽: https://whatsapp.com/channel/0029VbAxOna7NoZvhuKX362z
          𝗝𝗼𝗶𝗻 𝗢𝘂𝗿 𝗧𝗲𝗹𝗲𝗴𝗿𝗮𝗺: https://t.me/HD_Careers""".replace("\n          ", "\n")

          token = os.environ["TELEGRAM_BOT_TOKEN"].strip()
          channel = os.environ["TELEGRAM_CHANNEL_ID"].strip()
          payload = urlencode({
              "chat_id": channel,
              "text": text,
              "parse_mode": "HTML",
              "disable_web_page_preview": "false",
          }).encode()
          req = Request(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data=payload,
              method="POST",
              headers={"Content-Type": "application/x-www-form-urlencoded"},
          )
          with urlopen(req, timeout=30) as res:
              body = json.loads(res.read().decode())
          if not body.get("ok"):
              raise SystemExit(json.dumps(body))
          print("Accenture Data Engineer posted to Telegram.")
          PY
