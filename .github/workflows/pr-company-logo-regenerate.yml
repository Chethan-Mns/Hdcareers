name: One-Time Regenerate Job OG Previews on PR Branch

on:
  push:
    branches:
      - feature/og-company-logo-link-previews-20261122
    paths:
      - generate.py
      - tests/test_job_company_logo_og.py
      - .github/workflows/pr-company-logo-regenerate.yml

permissions:
  contents: write

concurrency:
  group: og-company-logo-pr-regenerate
  cancel-in-progress: false

jobs:
  generate-all-job-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/og-company-logo-link-previews-20261122
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure pages render verified company logos without generating images
        run: |
          python3 -m unittest discover -s tests -p test_job_company_logo_og.py -v
          python3 generate.py
          python3 -m unittest discover -s tests -p test_job_hero.py -v
      - name: Commit job page metadata only (no media creation)
        run: |
          set -euo pipefail
          git config user.name 'HD Careers OG Metadata Update'
          git config user.email 'actions@users.noreply.github.com'
          git add jobs/*.html
          if ! git diff --cached --quiet; then
            git commit -m "Set existing employer logos as social preview on every job page"
            git push origin HEAD:feature/og-company-logo-link-previews-20261122
          fi
