name: iOS Admin Build

on:
  push:
    branches:
      - main
      - preview/careers-favicon-logo-system
    paths:
      - ios-admin/**
      - assets/hd-careers-logo.png
      - .github/workflows/ios-admin-build.yml
  pull_request:
    branches:
      - main
    paths:
      - ios-admin/**
      - assets/hd-careers-logo.png
      - .github/workflows/ios-admin-build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-admin-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios-admin
        run: xcodegen generate

      - name: Build for iPhone Simulator
        working-directory: ios-admin
        run: |
          set -o pipefail
          xcodebuild             -project HDCareersAdmin.xcodeproj             -scheme HDCareersAdmin             -configuration Debug             -sdk iphonesimulator             -destination 'generic/platform=iOS Simulator'             CODE_SIGNING_ALLOWED=NO             build

      - name: Package simulator app
        run: |
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -path '*Build/Products/Debug-iphonesimulator/HD Careers Admin.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Simulator app was not found"
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" HDCareersAdmin-Simulator.zip

      - name: Upload simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDCareersAdmin-Simulator
          path: HDCareersAdmin-Simulator.zip
          retention-days: 14
