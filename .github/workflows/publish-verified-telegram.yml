name: Publish verified jobs to Telegram

on:
  push:
    branches: [main]
    paths:
      - data/telegram-retry-request.json
  workflow_dispatch:
    inputs:
      pages:
        description: 'Approved comma-separated jobs/*.html paths (optional if approval manifest exists)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Validate explicitly approved Telegram-only retry
        if: github.event_name == 'push'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          retry=json.loads(Path("data/telegram-retry-request.json").read_text())
          manifest=json.loads(Path("data/telegram-approved-batch.json").read_text())
          assert retry.get("requestId")=="retry-owner-reviewed-five-20261025"
          assert retry.get("approvedBy")=="HD Careers Owner"
          assert retry.get("batchId")=="admin-40164194484"
          assert retry["batchId"]==manifest.get("batchId")
          assert manifest.get("approved") is True
          assert isinstance(retry.get("pages"),list)
          assert len(retry["pages"])==5 and len(set(retry["pages"]))==5
          assert retry["pages"]==manifest.get("pages")
          print("Exact owner-approved five pages verified; retry sends only, no job republishing.")
          PY
      - name: Verify approved batch and deliver Telegram messages
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_PAGES: ${{ inputs.pages }}
        run: python3 scripts/publish_approved_telegram.py
      - name: Persist Telegram message IDs even when a batch stops
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f data/telegram-deliveries.json ]; then
            echo 'No Telegram deliveries to save.'
            exit 0
          fi
          git config user.name "HD Careers Telegram"
          git config user.email "actions@users.noreply.github.com"
          git add data/telegram-deliveries.json
          if git diff --cached --quiet; then
            echo 'Telegram delivery ledger unchanged.'
            exit 0
          fi
          git commit -m "Record Telegram delivery receipts"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Store delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telegram-delivery-evidence
          path: data/telegram-deliveries.json
          if-no-files-found: ignore
          retention-days: 30
