name: HD Careers Company Logo Repair - Build Once
on:
  push:
    branches: [fix/official-company-logos-all-20261019]
    paths:
      - .github/workflows/official-company-logo-rebuild-once.yml
permissions:
  contents: write
jobs:
  logo-rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/official-company-logos-all-20261019
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install raster logo validator
        run: python3 -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Verify uploaded brand assets and provider filtering
        run: |
          python3 -m py_compile generate.py scripts/resolve_company_logos.py tests/test_company_logo_sources.py
          python3 -m unittest discover -s tests -p test_company_logo_sources.py -v
      - name: Refresh employer-domain logos without touching curated assets
        timeout-minutes: 25
        run: python3 scripts/resolve_company_logos.py
      - name: Generate homepage and every current job page
        run: |
          python3 generate.py
          python3 generate.py --dry-run
          python3 -m unittest discover -s tests -p test_company_logo_sources.py -v
          git diff --check
      - name: Persist site-wide generated changes on feature branch
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/official-company-logo-rebuild-once.yml
          git config user.name "HD Careers Logo Quality"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          if git diff --cached --quiet; then echo 'No generated changes'; exit 0; fi
          git commit -m "Materialize official employer logos and regenerate complete website"
          git push origin HEAD:fix/official-company-logos-all-20261019

# Retry after replacing invalid bitmap transfers with validated vector artwork.
