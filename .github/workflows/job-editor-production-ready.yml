name: Secure Job Editor production-readiness tests
on:
  push:
    branches:
      - feature/production-job-editor-auth-20261011
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rbactests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate all admin server code syntax
        run: |
          for file in lib/admin-auth.js lib/admin-store.js api/admin/*.js; do node --check "$file"; done
      - name: Run Owner and Job Editor RBAC security tests
        run: node --test tests/multi-admin-rbac.test.mjs
      - name: Verify current HD Careers API and UI integrations preserved
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const read=p=>readFileSync(p,'utf8');
          for(const name of ['availability','daily-batch','extract-job','publish','review','reel-kit']){
            assert.match(read('api/admin/'+name+'.js'), /await requireAdmin\(req,\s*res/);
          }
          assert.match(read('api/admin/traffic.js'), /await requireAdmin\(req,\s*res,\s*\["owner"\]\)/);
          assert.match(read('api/admin/team.js'), /await requireAdmin\(req,\s*res,\s*\["owner"\]\)/);
          assert.match(read('admin/index.html'), /adminTeamLink/);
          assert.match(read('admin/index.html'), /\/admin\/reel-kit\.html/);
          assert.match(read('admin/index.html'), /\/admin\/review-batch\.html/);
          assert.match(read('admin/index.html'), /activeAdminRole===\"owner\"/);
          assert.match(read('api/admin/daily-batch.js'), /Ten priority jobs must be reviewed Live/);
          assert.match(read('api/admin/publish.js'), /admin_publish_jobs/);
          console.log('Original admin features and role checks preserved.');
          JS
