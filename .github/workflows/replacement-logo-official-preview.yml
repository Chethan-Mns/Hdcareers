name: Preview Official Compact Logos - 36
on:
  push:
    branches: [fix/android-analytics-push-preview-20261010]
    paths:
      - scripts/curate_replacement_logo_assets.py
      - scripts/repair_logo_review_assets.py
      - .github/workflows/replacement-logo-official-preview.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: logo-official-36
  cancel-in-progress: false
jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/android-analytics-push-preview-20261010
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download official/brand vector assets for review
        run: |
          python -m pip install "Pillow>=11,<13" "beautifulsoup4>=4.12,<5"
          python scripts/curate_replacement_logo_assets.py
      - name: Remove incorrect scraped logos and obtain verified corporate assets
        run: python scripts/repair_logo_review_assets.py
      - name: Commit review assets and provenance
        run: |
          git config user.name "HD Careers Asset Preview"
          git config user.email "actions@users.noreply.github.com"
          git add assets/company-marks-review data/replacement-logo-review.json
          if ! git diff --cached --quiet; then
            git commit -m "Add 36 locally hosted official compact logo candidates for preview"
            git pull --rebase origin fix/android-analytics-push-preview-20261010
            git push origin HEAD:fix/android-analytics-push-preview-20261010
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: HD-Careers-36-Official-Logo-Candidates
          path: |
            assets/company-marks-review
            data/replacement-logo-review.json
          retention-days: 14
