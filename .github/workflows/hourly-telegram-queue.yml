name: Hourly Telegram Job Announcements

on:
  push:
    branches: [main]
    paths:
      - data/telegram-scheduler-kick.json
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# GitHub scheduling is best-effort; due timestamps prevent early posts.
# Serialize with Admin publishing to protect claims and ledger writes.
concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  send-one:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh from current main
        run: |
          git fetch origin main
          git reset --hard origin/main
          git config user.name "HD Careers Hourly Telegram"
          git config user.email "actions@users.noreply.github.com"
      - name: Persist at-most-once claim before any send
        id: claim
        shell: bash
        run: |
          python3 scripts/hourly_telegram.py claim
          git add data/telegram-hourly-queue.json
          if ! git diff --cached --quiet; then
            git commit -m "Claim next hourly Telegram job safely"
            git push origin HEAD:main
          fi
      - name: Send only the claimed job and verify the live public page
        if: steps.claim.outputs.claimed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/hourly_telegram.py send
      - name: Persist delivery receipt (or uncertain result) without risking repost
        if: always() && steps.claim.outputs.claimed == 'true'
        shell: bash
        run: |
          git add data/telegram-hourly-queue.json data/telegram-deliveries.json
          if ! git diff --cached --quiet; then
            git commit -m "Record hourly Telegram delivery result"
            git push origin HEAD:main
          fi
      - name: Notify Android about confirmed Telegram job delivery
        if: success() && steps.claim.outputs.claimed == 'true'
        env:
          PUSH_SECRET: ${{ secrets.ANDROID_PUSH_DISPATCH_SECRET }}
        shell: bash
        run: |
          if [ "${#PUSH_SECRET}" -lt 32 ]; then
            echo "::warning::Android push secret missing; delivery receipt is still saved."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 --retry 2 \
            -H "Content-Type: application/json" \
            -H "x-hd-push-key: $PUSH_SECRET" \
            --data "$(jq -cn --arg id "telegram-$GITHUB_RUN_ID" '{action:"notify_telegram",batchId:$id}')" \
            "https://hdcareers.in/api/admin/android-devices" \
            || echo "::warning::Telegram delivery push failed; receipt remains the source of truth."
      - name: Upload hourly delivery evidence for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-telegram-evidence
          path: |
            data/telegram-hourly-queue.json
            data/telegram-deliveries.json
          if-no-files-found: ignore
          retention-days: 30
