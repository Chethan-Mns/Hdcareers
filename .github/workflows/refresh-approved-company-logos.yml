name: Refresh Verified Employer Logos

on:
  push:
    branches: [main]
    paths:
      - scripts/resolve_company_logos.py
      - scripts/employer_brand_sources.py
      - tests/test_employer_brand_sources.py
      - data/company-logo-domains.json
      - data/company-logo-direct.json
      - data/company-logo-vetted-careers-assets.json
      - data/jobs.json
      - data/approved-company-logos.json
      - .github/workflows/refresh-approved-company-logos.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-job-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install safe raster processing
        run: python3 -m pip install --disable-pip-version-check "Pillow>=11,<13"
      - name: Validate source verification and HTML / SVG parsing
        run: |
          python3 -m unittest discover -s tests -p test_employer_brand_sources.py -v
          python3 -m unittest discover -s tests -p test_company_logo_sources.py -v
      - name: Refresh only verified corporate domains and generated pages
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HD Careers Website Automation"
          git config user.email "actions@users.noreply.github.com"
          for attempt in 1 2 3 4 5 6; do
            git fetch origin main
            git reset --hard origin/main
            python3 scripts/resolve_company_logos.py
            python3 generate.py
            python3 generate.py --dry-run
            python3 -m unittest discover -s tests -p test_job_hero.py -v
            git diff --check
            git add data/jobs.json data/company-logos.json data/company-logo-review.json assets/company-icons index.html jobs/ insights.html insights/ robots.txt sitemap.xml
            if git diff --cached --quiet; then
              echo "Employer branding and generated pages already current."
              exit 0
            fi
            git commit -m "Refresh verified employer branding and job pages"
            if git push origin HEAD:main; then
              echo "Published verified logo assets; unresolved companies stay in review."
              exit 0
            fi
            echo "::warning::main moved during employer branding refresh; retrying"
            sleep 3
          done
          echo "::error::Could not publish brand refresh after safe retries."
          exit 1
