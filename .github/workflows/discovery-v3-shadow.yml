name: HD Careers V3 employer-first discovery shadow
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/discovery_v3_shadow.py
      - scripts/prepare_v3_ey_pilot.py
      - data/discovery-v3-ey-pilot-approval.json
      - .github/workflows/admin-job-generator.yml
      - data/discovery-v3-seeds.json
      - tests/test_discovery_v3_shadow.py
      - .github/workflows/discovery-v3-shadow.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests - fail closed on uncertain evidence
        run: python3 -m unittest discover -s tests -p 'test_discovery_v3_shadow.py' -v
      - name: Dry-run one EY publication through existing content contract
        run: |
          python3 - <<'PY'
          import json,sys,subprocess
          from pathlib import Path
          jobs=json.loads(Path("data/jobs.json").read_text())
          existing=[x for x in jobs if str(x.get("jobId",""))=="1750731" and x.get("company")=="EY"]
          if existing:
              ledger=json.loads(Path("data/telegram-deliveries.json").read_text())
              assert len(existing)==1
              assert any(x.get("page")==existing[0]["page"] and x.get("status")=="delivered" for x in ledger.values())
              print("Historical EY pilot has a confirmed website record and Telegram receipt; do not republish.")
          else:
              subprocess.run(["python3","scripts/prepare_v3_ey_pilot.py","/tmp/v3-ey-event.json","--skip-live-check"],check=True)
              sys.path.insert(0,"scripts")
              from admin_publish import validate
              data=json.loads(Path("/tmp/v3-ey-event.json").read_text())
              items=data["client_payload"]["jobs"]
              assert len(items)==1 and items[0]["jobId"]=="1750731"
              validate(items[0],1)
              print("EY pilot draft validated without publication.")
          PY
      - name: Shadow exact jobs on Deloitte EY and HCLTech official portals
        run: python3 scripts/discovery_v3_shadow.py --output discovery-v3-shadow-report.json
      - name: Read-only report summary
        run: |
          python3 - <<'PY'
          import json
          r=json.load(open("discovery-v3-shadow-report.json"))
          print("Read-only V3 results:",r["counts"])
          assert r["runType"]=="shadow_only"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: hd-careers-v3-shadow-evidence
          path: discovery-v3-shadow-report.json
          retention-days: 14
