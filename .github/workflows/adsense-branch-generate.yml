name: AdSense Branch Build

on:
  push:
    branches:
      - adsense-readiness
    paths:
      - .github/workflows/adsense-branch-generate.yml
      - generate.py
      - data/jobs.json

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review branch
        uses: actions/checkout@v4
        with:
          ref: adsense-readiness
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile generator
        run: python3 -m py_compile generate.py

      - name: Generate review site
        run: python3 generate.py

      - name: Validate generated output
        run: |
          git diff --check
          python3 generate.py --dry-run

      - name: Commit generated review files
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Generated review files are already current."
            exit 0
          fi
          git config user.name "HD Careers Review Build"
          git config user.email "actions@users.noreply.github.com"
          git add index.html jobs/ robots.txt sitemap.xml
          git commit -m "Generate AdSense review site"
          git push origin HEAD:adsense-readiness
