name: HDCareersAdmin
options:
  bundleIdPrefix: in.hdcareers
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  HDCareersAdmin:
    type: application
    platform: iOS
    sources:
      - path: HDCareersAdmin/HDCareersAdminApp.swift
    info:
      path: HDCareersAdmin/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.hdcareers.admin
        PRODUCT_NAME: "HD Careers Admin"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  HDCareersAdmin:
    build:
      targets:
        HDCareersAdmin: all
    run:
      config: Debug
    archive:
      config: Release
