name: HDCareersAdmin
options:
  bundleIdPrefix: in.hdcareers
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  HDCareersAdmin:
    type: application
    platform: iOS
    sources:
      - path: HDCareersAdmin
    resources:
      - path: ../assets/hd-careers-logo.png
    info:
      path: HDCareersAdmin/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.hdcareers.admin
        PRODUCT_NAME: "HD Careers Admin"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    preBuildScripts:
      - name: Prepare HD Careers App Icon
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="$SRCROOT/../assets/hd-careers-logo.png"
          DEST="$SRCROOT/HDCareersAdmin/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png"
          if [ -f "$SRC" ]; then
            cp "$SRC" "$DEST"
            /usr/bin/sips -Z 824 "$DEST" >/dev/null
            /usr/bin/sips -p 1024 1024 --padColor F7FAFF "$DEST" >/dev/null
          fi
schemes:
  HDCareersAdmin:
    build:
      targets:
        HDCareersAdmin: all
    run:
      config: Debug
    archive:
      config: Release
