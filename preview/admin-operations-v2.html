 return i<k?'done':i===k?'active':'todo';
}
const run=latestRun(),steps=state.live?.runs?.publishSteps||[];
if(i===0)return run?'done':'todo';
if(i===1)return run?'done':'todo';
if(i===2){var c=steps.filter(x=>/Commit directly to main|Add selected jobs/i.test(x.name));if(c.some(x=>x.conclusion==='failure'))return 'failed';if(c.some(x=>x.conclusion==='success'))return 'done';return run?.status==='in_progress'?'active':'todo'}
if(i===3)return rJobs().length&&rJobs()[0].site==='live'?'done':'todo';
if(i===4)return state.live?.queue?.some(x=>x.status==='pending'||x.status==='sending')?'active':'done';
if(i===5)return rJobs()[0]?.telegram==='delivered'?'done':'todo';
return 'todo'}
function pipelineCard(){
const run=latestRun();var log=state.sim.log.slice(-1)[0];
return '<div class="card grow"><div class="section-title"><div><h3>Publishing pipeline</h3><p>Actual status by stage, not an optimistic “submitted” toast</p></div>'+tag(state.mode==='demo'?(state.sim.active?'SIMULATING':'READY TO TEST'):(run?.status||'NO RUN'),state.mode==='demo'?'purple':'')+'</div>'+
'<ol class="steps">'+stages.map((n,i)=>{var status=stageStatus(i);var sub=state.mode==='demo'&&i===2?(state.sim.conflict?'Conflicted — safe retry '+state.sim.attempt+'/8':'Compare-and-swap · up to 8 retries'):i===4?'At most one new message per hour':i===5?'Recorded message ID required':i===3?'Exact production job-page check':i===0?'ATS ID + application route':'Owner approved · idempotent request';return '<li class="step '+status+'"><div class="step-icon">'+(status==='done'?'✓':status==='failed'?'!':status==='active'?'●':i+1)+'</div><div class="step-copy"><div><div class="step-name">'+n+'</div><div class="tiny">'+esc(sub)+'</div></div><span class="step-meta">'+(status==='active'?'<span class="spinner"></span> Working':status==='done'?'Done':status==='failed'?'Retrying':'Waiting')+'</span></div></li>'}).join('')+'</ol><div class="line"></div>'+
(state.mode==='demo'?'<div class="buttons"><button class="btn" data-act="simulate">▶ Test publish flow</button><button class="btn outline" data-act="conflict">↻ Simulate commit conflict</button></div>'+(log?'<p class="muted">'+esc(log)+'</p>':''):
'<div class="buttons"><button class="btn outline" data-act="refresh">↻ Refresh actual steps</button>'+(run?.url?'<a class="btn outline" target="_blank" rel="noopener noreferrer" href="'+esc(run.url)+'">GitHub run ↗</a>':'')+'</div>')+
'</div>'}
function queueCard(){let q=state.mode==='live'?(state.live?.queue||[]):[{page:'Ergomed',status:'pending'},{page:'Skild AI',status:'pending'}];
return '<div class="card w320"><div class="section-title"><div><h3>Telegram hourly queue</h3><p>Verified delivery. Never double-post.</p></div>'+tag(q.filter(x=>x.status==='pending').length+' waiting','warn')+'</div>'+
q.slice(0,5).map((x,i)=>'<div class="jobrow"><div class="mark '+(i?'violet':'')+'">'+(i?'02':'01')+'</div><div class="job-text"><div class="company">'+esc(x.page.includes('ergomed')||x.page==='Ergomed'?'Ergomed':x.page.includes('skild')||x.page==='Skild AI'?'Skild AI':x.page.split('/').pop().slice(0,22))+'</div><div class="role">'+esc(x.status==='pending'?'One message in upcoming hourly slot':x.status==='delivered'?'Delivered #'+x.messageId:'Awaiting attention')+'</div></div>'+tag(x.status,x.status==='delivered'?'good':x.status==='pending'?'warn':'bad')+'</div>').join('')+
'<div class="line"></div><div class="rightnote">⏱ Minimum <strong>60 minutes</strong> between confirmed messages. A failed or uncertain send is held, never automatically retried.</div></div>'}
function statCard(label,val,desc,icon){return '<div class="card stat"><div class="stat-head">'+esc(label)+'<span class="tile-icon">'+icon+'</span></div><div class="value">'+esc(val)+'</div><div class="desc">'+esc(desc)+'</div></div>'}
function today(){
const j=rJobs(),ex=rExpiry(),cnt=state.live?.counts||{};const ready=state.mode==='demo'?state.candidates.filter(x=>x.verified).length:state.live?.daily?.priority||0;
return '<div class="eyebrow">OPERATIONS / OCTOBER 2026</div><h1 class="heading">Good afternoon. You’re in control.</h1><p class="subtitle">One operational view for discovery, deployment, expiry and Telegram delivery. Less tapping, more publishing confidence.</p>'+
sourceBanner()+
'<div class="split"><div class="card highlight grow"><div class="eyebrow" style="color:#89bbff">DAILY COMMAND CENTER</div><h2>From discovery to delivery.<br>Without the guesswork.</h2><p>Deloitte-first, 87 priority employers, fresher-friendly jobs. Verify once, publish eligible positions in one go, and track each stage.</p><div class="buttons"><button class="btn light" data-tab="publish">Explore publishing →</button><button class="btn outline" data-tab="expiry">View exceptions</button></div></div><div class="card w320"><div class="section-title"><h3>Today’s runbook</h3>'+tag('9:00 AM IST','purple')+'</div><div class="jobrow"><span class="tile-icon">①</span><div class="job-text"><div class="company">Discover up to 20 jobs</div><div class="role">10 priority · 10 backup</div></div></div><div class="jobrow"><span class="tile-icon">②</span><div class="job-text"><div class="company">Check exact applications</div><div class="role">Duplicates & expirations excluded</div></div></div><div class="jobrow"><span class="tile-icon">③</span><div class="job-text"><div class="company">Publish ready jobs</div><div class="role">8 IT · 1 non-IT · 1 internship target</div></div></div><div class="jobrow"><span class="tile-icon">④</span><div class="job-text"><div class="company">Hourly Telegram delivery</div><div class="role">Real message IDs & audit trail</div></div></div></div></div>'+
'<div class="stats">'+statCard('Website jobs',state.mode==='live'?cnt.published||0:j.length,'Records in HD Careers','▦')+statCard('Telegram delivered',state.mode==='live'?cnt.confirmedDeliveries||0:j.filter(delivered).length,'Verified message receipts','↗')+statCard('Hourly pending',state.mode==='live'?cnt.pendingHourly||0:2,'Awaiting next eligible slot','◷')+statCard('Needs your attention',ex.length,'Availability exceptions','⚑')+'</div>'+
'<div class="split">'+pipelineCard()+queueCard()+'</div><div class="notice">🔒 Production is unchanged by preview interactions. '+(state.mode==='demo'?'Demo statuses and commit conflicts are simulated.':'Live stages are read-only and sourced from production records; application availability is checked separately.')+'</div>'}
function candidateCard(c){
return '<div class="listjob"><input type="checkbox" aria-label="Select '+esc(c.company)+'" data-check="'+esc(c.id)+'" '+(state.selected.has(c.id)?'checked ':'')+(!c.verified?'disabled ':'')+'/>'+
'<div class="mark">'+esc(initials(c.company))+'</div><div class="selectjob"><div class="company">'+esc(c.company)+' <span style="font-weight:500;color:#99a5b7">/ '+esc(c.category==='nonit'?'Non-IT':c.category==='internship'?'Internship':'Fresher IT')+'</span></div><div class="role">'+esc(c.role)+'</div><div class="meta">'+esc(c.location)+'</div></div><div>'+tag(c.verified?'Verified Live':'Hold',c.verified?'good':'warn')+'</div></div>'+(c.reason?'<div class="muted" style="padding-left:12px">↳ '+esc(c.reason)+'</div>':'')}
function publish(){
const verified=state.candidates.filter(x=>x.verified),held=state.candidates.filter(x=>!x.verified);const chosen=state.candidates.filter(x=>state.selected.has(x.id)&&x.verified);
return '<div class="eyebrow">ONE-GO PUBLISHING</div><h1 class="heading">Your publishing desk.</h1><p class="subtitle">Check evidence—not every job. Source-valid, never-before-published positions move into Ready. Others stay on hold.</p>'+sourceBanner()+
'<div class="stats">'+statCard('Demo candidates',state.candidates.length,'Illustrative candidates','▦')+statCard('Verified ready',verified.length,'Eligible to select','✓')+statCard('Selected',chosen.length,'One-go request','↗')+statCard('Held for review',held.length,'Not automatically posted','!')+'</div>'+
'<div class="two"><div class="card"><div class="section-title"><div><h3>Publish Ready</h3><p>Approve eligible jobs in one action; no duplicate company or requisition</p></div>'+tag(chosen.length+' selected','good')+'</div>'+
(verified.length?verified.map(candidateCard).join(''):'<div class="empty">No verified jobs to publish.</div>')+
'<div class="line"></div><div class="buttons"><button class="btn" data-act="simPublish" '+(chosen.length?'':'disabled')+'>▶ Preview '+chosen.length+'-job publishing flow</button><button class="btn outline" data-act="selectAll">Select all verified</button></div>'+
'<div class="notice">This preview cannot submit to GitHub. It demonstrates the exact status path you will approve for the native app.</div></div><div class="card"><div class="section-title"><div><h3>Held / Backups</h3><p>Reasons visible, no false “Live” status</p></div>'+tag(held.length+' held','warn')+'</div>'+
(held.map(candidateCard).join('')||'<div class="empty">No jobs held.</div>')+'<div class="line"></div><div class="rightnote"><strong>Release guardrails</strong><br>Require exact public requisition + functioning application + correct eligibility + unique URL/company. Commit conflicts retry with deduplication; uncertainty never becomes success.</div></div></div>'}
function expiry(){
const list=rExpiry();
return '<div class="eyebrow">EXCEPTION-ONLY REVIEW</div><h1 class="heading">Expiry intelligence.</h1><p class="subtitle">Only review uncertain cases. A 403, 404, bot challenge, or generic redirect is <strong>not</strong> proof of expiry.</p>'+sourceBanner()+
'<div class="stats">'+statCard('Exceptions',list.length,'Only issues requiring attention','⚑')+statCard('Checked',state.mode==='live'?state.live?.counts?.checked||0:120,'Last checker sample','▦')+statCard('Classified Active',state.mode==='live'?state.live?.counts?.active||0:113,'Automatic evidence','✓')+statCard('Confirmed expired',state.mode==='live'?state.live?.counts?.expired||0:0,'Evidence-backed closures','×')+'</div>'+
'<div class="two"><div class="card"><div class="section-title"><h3>Needs decision</h3>'+tag(list.length+' exceptions','warn')+'</div>'+
(list.map(x=>'<div class="listjob" style="display:block"><div style="display:flex;align-items:center;gap:10px"><div class="mark">'+esc(initials(x.company))+'</div><div class="job-text"><div class="company">'+esc(x.company)+'</div><div class="role">'+esc(x.role)+'</div></div>'+tag('Review','warn')+'</div><p class="muted">'+esc(x.reason)+'</p><div class="buttons">'+(x.apply?'<a class="btn outline" target="_blank" rel="noopener" href="'+esc(x.apply)+'">Exact official link ↗</a>':'')+
(state.mode==='demo'?'<button class="btn outline" data-act="keep" data-id="'+esc(x.id)+'">Keep published (demo)</button><button class="btn danger" data-act="expire" data-id="'+esc(x.id)+'">Confirm expired (demo)</button>':'<button class="btn outline" data-act="info">Read-only: decision requires evidence</button>')+'</div></div>').join('')||'<div class="empty">No outstanding exceptions detected.</div>')+'</div>'+
'<div class="card"><div class="section-title"><h3>Verification policy</h3>'+tag('SAFETY FIRST','good')+'</div><ol class="steps">'+[
 ['ATS evidence','Confirm exact requisition in the employer’s posting API.'],
 ['Search/listing evidence','Match exact job ID in current public inventory.'],
 ['Application journey','Follow the job-bound Apply route—not a generic career homepage.'],
 ['Human exception decision','Confirm only ambiguous cases; record evidence and audit trail.']
].map((x,i)=>'<li class="step done"><div class="step-icon">'+(i+1)+'</div><div class="step-copy"><div><div class="step-name">'+esc(x[0])+'</div><div class="muted">'+esc(x[1])+'</div></div></div></li>').join('')+'</ol><div class="rightnote">No automatic expiry based only on HTTP status, JavaScript render failure, or CAPTCHA. Manual Keep must capture exact source evidence instead of falsely marking a page “browser-verified”.</div></div></div>'}
function jobCard(j){
const label=j.telegram==='delivered'?'Telegram #'+j.messageId:j.telegram==='pending'?'Hourly queued':j.telegram==='sending'?'Sending':j.telegram==='uncertain'?'Needs attention':'Not queued';
return '<div class="jobrow"><div class="mark '+(j.telegram==='delivered'?'green':'')+'">'+esc(initials(j.company))+'</div><div class="job-text"><div class="company">'+esc(j.company)+'</div><div class="role">'+esc(j.role)+'</div><div class="meta">'+esc(j.location||'Location not supplied')+'</div></div><div class="rowactions">'+tag(label,j.telegram==='delivered'?'good':j.telegram==='pending'?'warn':'purple')+
(j.page?'<a class="btn outline" target="_blank" rel="noopener" href="https://hdcareers.in/'+esc(j.page)+'">Site ↗</a>':'')+
(j.messageId?'<a class="btn outline" target="_blank" rel="noopener" href="https://t.me/HD_Careers/'+encodeURIComponent(j.messageId)+'">Telegram ↗</a>':'')+'</div></div>'}
function jobsPage(){
const rows=rJobs().filter(j=>(state.filter==='All'||(state.filter==='Delivered'&&delivered(j))||(state.filter==='Queued'&&j.telegram==='pending')||(state.filter==='Needs review'&&(j.status==='expired'||j.telegram==='uncertain')))&&(String(j.company+' '+j.role).toLowerCase().includes(state.search.toLowerCase())));
return '<div class="eyebrow">JOBS & DELIVERY</div><h1 class="heading">Every job. Every receipt.</h1><p class="subtitle">One source of truth for published pages, actual Telegram message IDs, and jobs awaiting the next hourly delivery.</p>'+sourceBanner()+
'<div class="card"><div class="section-title"><div><h3>Publishing ledger</h3><p>Search the website records and cross-check delivery status</p></div>'+tag(rows.length+' visible','purple')+'</div>'+
'<input class="search" id="searchJobs" placeholder="Search company or role…" value="'+esc(state.search)+'" aria-label="Search jobs">'+
'<div class="pillnav" style="margin-top:14px">'+['All','Delivered','Queued','Needs review'].map(s=>'<button data-filter="'+esc(s)+'" class="'+(state.filter===s?'active':'')+'">'+esc(s)+'</button>').join('')+'</div>'+

'<div class="notice">Displayed delivery status comes from recorded Telegram receipts and the hourly queue, not a client-side success assumption.</div></div>'}
function loginModal(){return '<div class="modalshade"><form class="modal" id="loginForm"><h3>Connect secure live telemetry</h3><p>Use your HD Careers admin session to see read-only data from main. Credentials are sent directly to the existing admin login API and are not stored in the preview.</p><label for="user">Admin username</label><input class="search" id="user" name="user" required autocomplete="username"><label for="password">Password</label><input class="search" id="password" type="password" name="password" required autocomplete="current-password"><p class="muted">No publishing or expiry endpoints are called from this preview.</p><div class="buttons"><button class="btn" type="submit">Connect securely</button><button class="btn outline" type="button" data-act="closeLogin">Cancel</button></div></form></div>'}
function modal(){document.getElementById('overlay').innerHTML=state.showLogin?loginModal():''}
function render(){nav();document.getElementById('page').innerHTML=state.tab==='today'?today():state.tab==='publish'?publish():state.tab==='expiry'?expiry():jobsPage();modal()}
function toast(txt){let z=document.getElementById('toastZone');z.innerHTML='<div class="toast">'+esc(txt)+'</div>';clearTimeout(toast._id);toast._id=setTimeout(()=>z.innerHTML='',4800)}
async function loadLive(){
if(state.mode!=='live')return;
state.loading=true;nav();
try{
const response=await fetch('/api/admin/operations-preview',{cache:'no-store',credentials:'same-origin',headers:{Accept:'application/json'}});
if(!response.ok){const v=await response.json().catch(()=>({}));throw new Error(v.error||'Live telemetry returned HTTP '+response.status)}
state.live=await response.json();state.liveError='';state.lastSync=new Date().toISOString();
}catch(e){state.liveError=e.message; if(!state.live&&/401|403|sign.in|authenticated|unauthorized/i.test(e.message))state.showLogin=true}
finally{state.loading=false;render()}
}
function simulate(conflict){
if(state.sim.active){toast('A demo flow is already running.');return}
state.mode='demo';state.tab='today';state.sim={active:true,step:0,attempt:1,conflict:!!conflict,log:['Simulation started — no real GitHub or Telegram requests.']};render();
var phases=[0,1,2,2,3,4,5],i=0;
function tick(){
if(!state.sim.active)return;
if(i>=phases.length){state.sim.active=false;state.sim.log.push('Demo completed: Telegram message IDs would be recorded. No actual messages were sent.');render();return}
state.sim.step=phases[i];
if(i===2&&conflict){state.sim.attempt=1;state.sim.log.push('Simulated GitHub 409: branch moved; re-read latest main and rebuild from job IDs, do not double-send.')}
if(i===3&&conflict){state.sim.attempt=2;state.sim.conflict=false;state.sim.log.push('Simulated retry 2/8: compare-and-swap commit succeeded; publication still deduplicated.')}
if(i===4)state.sim.log.push('Simulated website check: exact job page is live before Telegram queue.');
if(i===5)state.sim.log.push('Simulated hourly queue: minimum 60 minutes, compressed to seconds for demo.');
if(i===6)state.sim.log.push('Simulated receipt #DEMO-001; real delivery requires an actual Telegram message ID.');
i++;render();setTimeout(tick,i===3?1500:1150)}
setTimeout(tick,500)
}
document.addEventListener('click',function(e){
const bt=e.target.closest('[data-tab]');if(bt){state.tab=bt.dataset.tab;render();return}
const el=e.target.closest('[data-act]');if(!el)return;
const act=el.dataset.act;
if(act==='demo'){state.mode='demo';state.live=null;state.showLogin=false;render();return}
if(act==='live'){state.mode='live';state.showLogin=false;render();loadLive();return}
if(act==='refresh'){if(state.mode==='live')loadLive();else toast('Demo mode uses sample data. Select Live for current read-only telemetry.');return}
if(act==='login'){state.showLogin=true;modal();return}
if(act==='closeLogin'){state.showLogin=false;state.mode=state.live?'live':'demo';render();return}
if(act==='simulate'||act==='simPublish'){simulate(false);return}
if(act==='conflict'){simulate(true);return}
if(act==='info'){toast('Preview is read-only. Production review decisions require an audited source-backed action.');return}
if(act==='selectAll'){state.selected=new Set(state.candidates.filter(x=>x.verified).map(x=>x.id));render();return}
if(act==='keep'||act==='expire'){
if(state.mode!=='demo'){toast('Live mode is read-only.');return}
const c=state.exceptions.find(x=>x.id===el.dataset.id);if(c){c.state=act==='expire'?'expired':'active';toast('Demo-only change: '+c.company+' marked '+c.state+'. No website changes.');render()}return
}
});
document.addEventListener('change',function(e){const id=e.target?.dataset?.check;if(id){if(e.target.checked)state.selected.add(id);else state.selected.delete(id);render()}});
document.addEventListener('input',function(e){if(e.target.id==='searchJobs'){state.search=e.target.value;const pos=e.target.selectionStart;render();const n=document.getElementById('searchJobs');if(n){n.focus();n.setSelectionRange(pos,pos)}}});
document.addEventListener('click',function(e){const p=e.target.closest('[data-filter]');if(p){state.filter=p.dataset.filter;render()}});
document.addEventListener('submit',async function(e){if(e.target.id!=='loginForm')return;e.preventDefault();const f=e.target;const user=f.querySelector('#user').value,password=f.querySelector('#password').value;
try{const r=await fetch('/api/admin/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:user,password:password})});const obj=await r.json().catch(()=>({}));if(!r.ok||!obj.authenticated)throw new Error(obj.error||'Login not accepted by preview environment');state.showLogin=false;state.mode='live';await loadLive();toast('Secure read-only telemetry connected.')}catch(err){toast('Login not connected: '+err.message)}});
setInterval(function(){if(state.mode==='live'&&!state.loading&&document.visibilityState==='visible')loadLive()},20000);
render();
})();
</script>
